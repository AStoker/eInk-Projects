ace</text><circle class="balloon" cx="180.80" cy="61.80" r="2.80"/><text class="baltxt" x="180.80" y="62.95" text-anchor="middle" font-size="3.1">4</text><text class="note" x="187.00" y="62.80" text-anchor="start" font-size="2.7">dia 2.15 axle hole. Use a 2 rod or a 1.75</text><text class="note" x="187.00" y="66.50" text-anchor="start" font-size="2.7">filament offcut</text><circle class="balloon" cx="180.80" cy="72.00" r="2.80"/><text class="baltxt" x="180.80" y="73.15" text-anchor="middle" font-size="3.1">5</text><text class="note" x="187.00" y="73.00" text-anchor="start" font-size="2.7">foot R5. The heel behind the pin is cut by</text><text class="note" x="187.00" y="76.70" text-anchor="start" font-size="2.7">the pocket floor at the 58 deg stop, which</text><text class="note" x="187.00" y="80.40" text-anchor="start" font-size="2.7">is what takes the load</text><text class="note" x="166.00" y="164.60" text-anchor="start" font-size="2.35">STLs export flat-face-down and MIRRORED IN X (print_mirror = true)</text><rect class="tbframe" x="166.00" y="167.00" width="96.00" height="18.00" rx="0.00"/><line class="tbrule" x1="166.00" y1="176.00" x2="262.00" y2="176.00"/><line class="tbrule" x1="218.80" y1="176.00" x2="218.80" y2="185.00"/><line class="tbrule" x1="240.88" y1="176.00" x2="240.88" y2="185.00"/><text class="tbname" x="168.00" y="173.12" text-anchor="start" font-size="3.6">DISC &amp; LEG</text><text class="tbmeta" x="168.00" y="182.30" text-anchor="start" font-size="2.4">UNITS mm &#183; SCALE 1:1</text><text class="tbmeta" x="221.20" y="182.30" text-anchor="start" font-size="2.4">SHEET 6/8</text><text class="tbmeta" x="242.80" y="182.30" text-anchor="start" font-size="2.4">REV E</text></svg>