# Now render everything on the ePaper screen.
display:
  - platform: t547
    id: eink_display
    update_interval: never
    setup_priority: 1000
    rotation: 90°
    lambda: |-
      // Map weather states to MDI characters.
      std::map<std::string, std::string> weather_icon_map
        {
          {"cloudy", "\U000F0590"},
          {"cloudy-alert", "\U000F0F2F"},
          {"cloudy-arrow-right", "\U000F0E6E"},
          {"clear-night", "\U000F0594"},
          {"fog", "\U000F0591"},
          {"hail", "\U000F0592"},
          {"hazy", "\U000F0F30"},
          {"hurricane", "\U000F0898"},
          {"lightning", "\U000F0593"},
          {"lightning-rainy", "\U000F067E"},
          {"night", "\U000F0594"},
          {"night-partly-cloudy", "\U000F0F31"},
          {"partlycloudy", "\U000F0595"},
          {"partly-lightning", "\U000F0F32"},
          {"partly-rainy", "\U000F0F33"},
          {"partly-snowy", "\U000F0F34"},
          {"partly-snowy-rainy", "\U000F0F35"},
          {"pouring", "\U000F0596"},
          {"rainy", "\U000F0597"},
          {"snowy", "\U000F0598"},
          {"snowy-heavy", "\U000F0F36"},
          {"snowy-rainy", "\U000F067F"},
          {"sunny", "\U000F0599"},
          {"sunny-alert", "\U000F0F37"},
          {"sunny-off", "\U000F14E4"},
          {"sunset", "\U000F059A"},
          {"sunset-down", "\U000F059B"},
          {"sunset-up", "\U000F059C"},
          {"tornado", "\U000F0F38"},
          {"windy", "\U000F059D"},
          {"windy-variant", "\U000F059E"},
        };

      // Left from Madelena's code... perhaps if you want a black or colored background first (useful for fast-refresh screens?) to fill the background.
      it.fill(color_bg);

      // Alignment rectangles! (uncomment to use - useful when first mounting the eInk screen)
      // it.rectangle(0, 0, 540, 960);
      // it.rectangle(10, 10, 520, 940);
      // it.rectangle(20, 20, 500, 920);
      // it.rectangle(30, 30, 480, 900);
      // it.rectangle(40, 40, 460, 880);
      // it.rectangle(50, 50, 440, 860);
      // it.rectangle(60, 60, 420, 840);
      // it.rectangle(70, 70, 400, 820);
      // it.rectangle(80, 80, 380, 800);

      // CURRENT WEATHER
      it.printf(270, 65, id(font_title), color_txt, TextAlign::TOP_CENTER, id(weather_now_title).state.c_str());
      it.printf(130, 150, id(font_mdi_large), color_txt, TextAlign::TOP_CENTER, "%s", weather_icon_map[id(weather_now_condition).state.c_str()].c_str());
      it.printf(330, 150, id(font_now_temp), color_txt, TextAlign::TOP_CENTER, "%2.0f°F", id(weather_now_temperature).state);

      // HOURLY (Today/Tomorrow)
      it.printf(270, 285, id(font_small_title), color_txt, TextAlign::TOP_CENTER, id(weather_hourly_title).state.c_str());
      
      // Entry 1
      // Icon
      it.printf(150, 360, id(font_mdi_small), color_txt, TextAlign::TOP_CENTER, "%s", weather_icon_map[id(weather_hourly_condition_0).state.c_str()].c_str());
      // Hour timestamp
      it.printf(325, 360, id(font_today_time), color_txt, TextAlign::TOP_CENTER, "%s", id(weather_hourly_timestamp_0).state.c_str());
      // Temp
      it.printf(325, 410, id(font_today_temp), color_txt, TextAlign::TOP_CENTER, "%2.0f°F", id(weather_hourly_temperature_0).state);

      // Entry 2
      // Icon
      it.printf(150, 510, id(font_mdi_small), color_txt, TextAlign::TOP_CENTER, "%s", weather_icon_map[id(weather_hourly_condition_1).state.c_str()].c_str());
      // Hour timestamp
      it.printf(325, 510, id(font_today_time), color_txt, TextAlign::TOP_CENTER, "%s", id(weather_hourly_timestamp_1).state.c_str());
      // Temp
      it.printf(325, 560, id(font_today_temp), color_txt, TextAlign::TOP_CENTER, "%2.0f°F", id(weather_hourly_temperature_1).state);

      // Entry 3
      // Icon
      it.printf(150, 660, id(font_mdi_small), color_txt, TextAlign::TOP_CENTER, "%s", weather_icon_map[id(weather_hourly_condition_2).state.c_str()].c_str());
      // Hour timestamp
      it.printf(325, 660, id(font_today_time), color_txt, TextAlign::TOP_CENTER, "%s", id(weather_hourly_timestamp_2).state.c_str());
      // Temp
      it.printf(325, 710, id(font_today_temp), color_txt, TextAlign::TOP_CENTER, "%2.0f°F", id(weather_hourly_temperature_2).state);

      // Refresh Timestamp with time and day
      // from https://community.home-assistant.io/t/esphome-show-time/348903
      char str[17];
      time_t currTime = id(homeassistant_time).now().timestamp;
      strftime(str, sizeof(str), "%l:%M%p %a", localtime(&currTime));
      it.printf(270, 850, id(font_refresh_stamp), color_txt, TextAlign::TOP_CENTER, "Refreshed at %s", str);

      // Battery Icon by Trip5 (placement at bottom right can be tricky)
      std::map<std::string, std::string> battery_icon_map
      {
        {"batteryhigh", "\U000F12A3"},
        {"batterymed", "\U000F12A2"},
        {"batterylow", "\U000F12A1"},
        {"batterywarn", "\U000F10CD"}
      };
      int batt_x = 500; 
      int batt_y = 880;
      float batt_v = roundf(id(battery_voltage).state * 100) / 100;
      if (batt_v < 3.10) { it.printf(batt_x, batt_y, id(font_battery_glyphs), color_txt, TextAlign::TOP_CENTER, "%s", battery_icon_map["batterywarn"].c_str()); }
      if (batt_v >= 3.10 && batt_v < 3.20) { it.printf(batt_x, batt_y, id(font_battery_glyphs), color_txt, TextAlign::TOP_CENTER, "%s", battery_icon_map["batterylow"].c_str()); }
      if (batt_v >= 3.20 && batt_v < 3.40) { it.printf(batt_x, batt_y, id(font_battery_glyphs), color_txt, TextAlign::TOP_CENTER, "%s", battery_icon_map["batterymed"].c_str()); }
      if (batt_v >= 3.40 && batt_v < 3.60) { it.printf(batt_x, batt_y, id(font_battery_glyphs), color_txt, TextAlign::TOP_CENTER, "%s", battery_icon_map["batteryhigh"].c_str()); }
      // We won't display battery indicator if at a nearly full charge (3.6V+)
 