<text x="357.50" y="150.90" class="note" font-size="2.6" text-anchor="start">deployed indent</text>
<text x="357.50" y="153.80" class="note" font-size="2.6" text-anchor="start">+ hard stop</text>
<line x1="344.00" y1="133.30" x2="320.00" y2="135.00" class="lead"/>
<text x="318.50" y="135.90" class="note" font-size="2.6" text-anchor="end">hump 0.38</text>
<line x1="354.00" y1="116.00" x2="354.00" y2="131.00" class="dim"/>
<line x1="352.40" y1="116.00" x2="355.60" y2="116.00" class="dim"/>
<line x1="352.40" y1="131.00" x2="355.60" y2="131.00" class="dim"/>
<text x="352.50" y="123.50" class="dim" font-size="2.7" text-anchor="middle" transform="rotate(-90 352.50 123.50)">piv_h 2.5</text>
<text x="342.00" y="166.00" class="note" font-size="2.7" text-anchor="middle">stub 2.88 at 72.5&#176;  ·  indent 0.25</text>
<text x="342.00" y="171.00" class="note" font-size="2.7" text-anchor="middle">72.5&#176; = 90&#176; &#8722; dep_ang/2, which is what puts</text>
<text x="342.00" y="175.50" class="note" font-size="2.7" text-anchor="middle">the tip on the floor at BOTH ends</text>
<text x="20.00" y="208.00" class="note" font-size="2.85" text-anchor="start">1   The leg is a LEVER.  Beyond the pin sits a stub; at dep_ang it bottoms in the deployed indent, so the load path is</text>
<text x="20.00" y="212.85" class="note" font-size="2.85" text-anchor="start">     leg → stub → cover, in COMPRESSION.  Nothing is held out by friction or by a spring, which is what the disc design</text>
<text x="20.00" y="217.70" class="note" font-size="2.85" text-anchor="start">     had been reduced to — and why it did not hold.</text>
<text x="20.00" y="222.55" class="note" font-size="2.85" text-anchor="start">2   The swing is 35&#176;, under 90&#176; on purpose.  Past 90&#176; the stub dives below the floor — that is exactly the 1.80 mm jam</text>
<text x="20.00" y="227.40" class="note" font-size="2.85" text-anchor="start">     at 64&#176; the old 122&#176; swing produced.  Under 90&#176; it cannot recur; it is not merely avoided.</text>
<text x="20.00" y="232.25" class="note" font-size="2.85" text-anchor="start">3   TWO INDENTS FROM ONE STUB.  Set the stub at 90&#176; &#8722; dep_ang/2 and its tip reaches the floor at BOTH ends of the</text>
<text x="20.00" y="237.10" class="note" font-size="2.85" text-anchor="start">     stroke, digging 0.38 into the floor plane in between.  That dig is the snap: one indent holds it closed, one holds</text>
<text x="20.00" y="241.95" class="note" font-size="2.85" text-anchor="start">     it deployed, and the deployed indent's far wall is the hard stop.  Under load the stub is pushed INTO its indent.</text>
<text x="20.00" y="246.80" class="note" font-size="2.85" text-anchor="start">4   The &#216;2 pin is kept — pressed through the leg, snapped into C sockets in the cover's ears.  Those sockets are also</text>
<text x="20.00" y="251.65" class="note" font-size="2.85" text-anchor="start">     the spring: the pin lifts 0.38 to ride the hump.  No screw, no insert, and the leg pops out for service.</text>
<text x="20.00" y="256.50" class="note" font-size="2.85" text-anchor="start">5   The folded foot tip stops at z 3.0, clear of the 2.0 rear chamfer, so NOTHING overhangs the bottom edge.  Below</text>
<text x="20.00" y="261.35" class="note" font-size="2.85" text-anchor="start">     z 9 the cover is backed by solid frame, so the recess steps to 1.0 and the leg tapers to 1.0 at the tip.</text>
<text x="20.00" y="266.20" class="note" font-size="2.85" text-anchor="start">6   PORTRAIT ONLY.  The rotating disc, bayonet, four rotation detents, clamp land, flexure tongue and detent bridge</text>
<text x="20.00" y="271.05" class="note" font-size="2.85" text-anchor="start">     are all deleted.  The recess misses the driver carrier entirely, so removing the puck keeps its full 4.55 mm.</text>
<text x="20.00" y="275.90" class="note" font-size="2.85" text-anchor="start">7   TO CHECK: the recess ceiling is a 16 mm bridge in the cover's current print orientation.  May want the cover</text>
<text x="20.00" y="280.75" class="note" font-size="2.85" text-anchor="start">     printed the other way up, or a bridging rib across the recess.</text>
<rect x="8.00" y="8.00" width="404.00" height="281.00" rx="0" class="border"/>
<line x1="8.00" y1="32.00" x2="412.00" y2="32.00" class="border"/>
<line x1="8.00" y1="202.00" x2="412.00" y2="202.00" class="border"/>
<text x="210.00" y="17.50" class="vlabel" font-size="5.4" text-anchor="middle">PROPOSAL — kickstand redesign:  lever leg, mechanical stop, two indents, no rotating disc</text>
<text x="210.00" y="25.00" class="sub" font-size="3.0" text-anchor="middle">4.2" e-Paper desk frame   ·   for review before any geometry is cut   ·   2026-08-26</text>
</svg>
