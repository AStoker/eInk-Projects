ext><line class="dim" x1="61.00" y1="92.00" x2="83.00" y2="105.00"/><path class="arrow" d="M61.00,92.00 L62.64,92.37 L62.12,93.25 Z"/><circle class="balloon" cx="83.00" cy="105.00" r="2.80"/><text class="baltxt" x="83.00" y="106.15" text-anchor="middle" font-size="3.1">1</text><line class="dim" x1="66.20" y1="64.00" x2="89.00" y2="60.00"/><path class="arrow" d="M66.20,64.00 L67.69,63.22 L67.86,64.23 Z"/><circle class="balloon" cx="89.00" cy="60.00" r="2.80"/><text class="baltxt" x="89.00" y="61.15" text-anchor="middle" font-size="3.1">2</text><line class="dim" x1="60.00" y1="48.35" x2="74.00" y2="45.00"/><path class="arrow" d="M60.00,48.35 L61.44,47.48 L61.68,48.48 Z"/><circle class="balloon" cx="74.00" cy="45.00" r="2.80"/><text class="baltxt" x="74.00" y="46.15" text-anchor="middle" font-size="3.1">3</text><text class="note" x="60.00" y="125.00" text-anchor="middle" font-size="2.8">thickness 4</text><text class="vlabel" x="138.00" y="20.00" text-anchor="middle" font-size="3.0">LEG  &#183;  printed flat</text><path class="part" d="M132.00,34.00 A6.0,6.0 0 0 1 144.00,34.00 L143.00,64.40 A5.0,5.0 0 0 1 133.00,64.40 Z"/><circle class="cut" cx="138.00" cy="34.00" r="1.00"/><line class="cl" x1="138.00" y1="24.00" x2="138.00" y2="77.40"/><line class="ext" x1="138.00" y1="34.00" x2="120.80" y2="34.00"/><line class="ext" x1="138.00" y1="69.40" x2="120.80" y2="69.40"/><line class="dim" x1="122.00" y1="34.00" x2="122.00" y2="69.40"/><path class="arrow" d="M122.00,34.00 L122.51,35.60 L121.49,35.60 Z"/><path class="arrow" d="M122.00,69.40 L121.49,67.80 L122.51,67.80 Z"/><text class="dimtxt" x="120.70" y="51.70" text-anchor="middle" font-size="3.0" transform="rotate(-90 120.70 51.70)">35.4</text><line class="ext" x1="132.00" y1="34.00" x2="132.00" y2="24.80"/><line class="ext" x1="144.00" y1="34.00" x2="144.00" y2="24.80"/><line class="dim" x1="132.00" y1="26.00" x2="144.00" y2="26.00"/><path class="arrow" d="M132.00,26.00 L133.60,25.49 L133.60,26.51 Z"/><path class="arrow" d="M144.00,26.00 L142.40,26.51 L142.40,25.49 Z"/><text class="dimtxt" x="138.00" y="24.70" text-anchor="middle" font-size="3.0">12</text><line class="dim" x1="139.00" y1="34.00" x2="153.00" y2="29.00"/><path class="arrow" d="M139.00,34.00 L140.33,32.98 L140.68,33.94 Z"/><circle class="balloon" cx="153.00" cy="29.00" r="2.80"/><text class="baltxt" x="153.00" y="30.15" text-anchor="middle" font-size="3.1">4</text><line class="dim" x1="138.00" y1="68.40" x2="153.00" y2="67.40"/><path class="arrow" d="M138.00,68.40 L139.56,67.78 L139.63,68.80 Z"/><circle class="balloon" cx="153.00" cy="67.40" r="2.80"/><text class="baltxt" x="153.00" y="68.55" text-anchor="middle" font-size="3.1">5</text><line class="dim" x1="54.30" y1="92.00" x2="31.00" y2="105.00"/><path class="arrow" d="M54.30,92.00 L53.15,93.23 L52.65,92.33 Z"/><circle class="balloon" cx="31.00" cy="105.00" r="2.80"/><text class="baltxt" x="31.00" y="106.15" text-anchor="middle" font-size="3.1">6</text><line class="dim" x1="132.00" y1="31.00" x2="116.00" y2="16.00"/><path class="arrow" d="M132.00,31.00 L130.48,30.28 L131.18,29.53 Z"/><circle class="balloon" cx="116.00" cy="16.00" r="2.80"/><text class="baltxt" x="116.00" y="17.15" text-anchor="middle" font-size="3.1">7</text><line class="dim" x1="60.00" y1="95.25" x2="31.00" y2="45.00"/><path class="arrow" d="M60.00,95.25 L58.76,94.12 L59.64,93.61 Z"/><circle class="balloon" cx="31.00" cy="45.00" r="2.80"/><text class="baltxt" x="31.00" y="46.15" text-anchor="middle" font-size="3.1">8</text><text class="note" x="138.00" y="83.40" text-anchor="middle" font-size="2.8">thickness 3.4</text><text class="vlabel" x="178.00" y="22.00" text-anchor="start" font-size="3.2">NOTES</text><circle class="balloon" cx="180.80" cy="27.50" r="2.80"/><text class="baltxt" x="180.80" y="28.65" text-anchor="middle" font-size="3.1">1</text><text class="note" x="187.00" y="28.50" text-anchor="start" font-size="2.7">dia 2.25 pin hole, straight through the</text><text class="note" x="187.00" y="32.20" text-anchor="start" font-size="2.7">disc. Pin is trapped by the pocket wall</text><text class="note" x="187.00" y="35.90" text-anchor="start" font-size="2.7">once the disc is fitted</text><circle class="balloon" cx="180.80" cy="41.40" r="2.80"/><text class="baltxt" x="180.80" y="42.55" text-anchor="middle" font-size="3.1">2</text><text class="note" x="187.00" y="42.40" text-anchor="start" font-size="2.7">leg slot 12.4 wide against a 12 leg, taken</text><text class="note" x="187.00" y="46.10" text-anchor="start" font-size="2.7">to 11.9 by a clamp land 0.5 proud over 8</text><text class="note" x="187.00" y="49.80" text-anchor="start" font-size="2.7">at the pivot - that 0.1 of interference is</text><text class="note" x="187.00" y="53.50" text-anchor="start" font-size="2.7">what holds the leg at any angle. A catch</text><text class="note" x="187.00" y="57.20" text-anchor="start" font-size="2.7">lip 0.65 proud at the far end snaps over</text><text class="note" x="187.00" y="60.90" text-anchor="start" font-size="2.7">the foot when the leg folds</text><circle class="balloon" cx="180.80" cy="66.40" r="2.80"/><text class="baltxt" x="180.80" y="67.55" text-anchor="middle" font-size="3.1">6</text><text class="note" x="187.00" y="67.40" text-anchor="start" font-size="2.7">relief slot 0.8 wide behind the land,</text><text class="note" x="187.00" y="71.10" text-anchor="start" font-size="2.7">leaving a tongue 0.8 x 4 x 14.25 fixed at</text><text class="note" x="187.00" y="74.80" text-anchor="start" font-size="2.7">both ends - 77.82 N/mm, so print variance</text><text class="note" x="187.00" y="78.50" text-anchor="start" font-size="2.7">moves the clamp force instead of jamming</text><text class="note" x="187.00" y="82.20" text-anchor="start" font-size="2.7">the leg</text><circle class="balloon" cx="180.80" cy="87.70" r="2.80"/><text class="baltxt" x="180.80" y="88.85" text-anchor="middle" font-size="3.1">3</text><text class="note" x="187.00" y="88.70" text-anchor="start" font-size="2.7">three bayonet lugs, 26 deg wide x 1.3</text><text class="note" x="187.00" y="92.40" text-anchor="start" font-size="2.7">proud, on the inner face</text><circle class="balloon" cx="180.80" cy="97.90" r="2.80"/><text class="baltxt" x="180.80" y="99.05" text-anchor="middle" font-size="3.1">4</text><text class="note" x="187.00" y="98.90" text-anchor="start" font-size="2.7">dia 2.15 axle hole. Use a 2 rod or a 1.75</text><text class="note" x="187.00" y="102.60" text-anchor="start" font-size="2.7">filament offcut</text><circle class="balloon" cx="180.80" cy="108.10" r="2.80"/><text class="baltxt" x="180.80" y="109.25" text-anchor="middle" font-size="3.1">5</text><text class="note" x="187.00" y="109.10" text-anchor="start" font-size="2.7">foot R5</text><circle class="balloon" cx="180.80" cy="114.60" r="2.80"/><text class="baltxt" x="180.80" y="115.75" text-anchor="middle" font-size="3.1">8</text><text class="note" x="187.00" y="115.60" text-anchor="start" font-size="2.7">slot rear wall 3.25 behind the pivot - the</text><text class="note" x="187.00" y="119.30" text-anchor="start" font-size="2.7">deployed hard stop. The leg reaches this</text><text class="note" x="187.00" y="123.00" text-anchor="start" font-size="2.7">far back only in the last degree or two of</text><text class="note" x="187.00" y="126.70" text-anchor="start" font-size="2.7">the swing (2.48 by 110 deg, 3.25 at 122),</text><text class="note" x="187.00" y="130.40" text-anchor="start" font-size="2.7">and past it the interference grows about</text><text class="note" x="187.00" y="134.10" text-anchor="start" font-size="2.7">0.07 mm/deg</text><circle class="balloon" cx="180.80" cy="139.60" r="2.80"/><text class="baltxt" x="180.80" y="140.75" text-anchor="middle" font-size="3.1">7</text><text class="note" x="187.00" y="140.60" text-anchor="start" font-size="2.7">heel: rear of the hub is an arc at R1.75</text><text class="note" x="187.00" y="144.30" text-anchor="start" font-size="2.7">over local 148 to 270 deg, because the</text><text class="note" x="187.00" y="148.00" text-anchor="start" font-size="2.7">pivot axis is only 2 above the pocket</text><text class="note" x="187.00" y="151.70" text-anchor="start" font-size="2.7">floor and anything further out orbits into</text><text class="note" x="187.00" y="155.40" text-anchor="start" font-size="2.7">it. The flat keeps its short side, which</text><text class="note" x="187.00" y="159.10" text-anchor="start" font-size="2.7">lands on the floor at the 58 deg stop and</text><text class="note" x="187.00" y="162.80" text-anchor="start" font-size="2.7">takes the load</text><text class="note" x="166.00" y="164.60" text-anchor="start" font-size="2.35">STLs export flat-face-down, as drawn (print_mirror = false)</text><rect class="tbframe" x="166.00" y="167.00" width="96.00" height="18.00" rx="0.00"/><line class="tbrule" x1="166.00" y1="176.00" x2="262.00" y2="176.00"/><line class="tbrule" x1="218.80" y1="176.00" x2="218.80" y2="185.00"/><line class="tbrule" x1="240.88" y1="176.00" x2="240.88" y2="185.00"/><text class="tbname" x="168.00" y="173.12" text-anchor="start" font-size="3.6">DISC &amp; LEG</text><text class="tbmeta" x="168.00" y="182.30" text-anchor="start" font-size="2.4">UNITS mm &#183; SCALE 1:1</text><text class="tbmeta" x="221.20" y="182.30" text-anchor="start" font-size="2.4">SHEET 6/8</text><text class="tbmeta" x="242.80" y="182.30" text-anchor="start" font-size="2.4">REV E</text></svg>