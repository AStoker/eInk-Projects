="51.60" r="2.80"/><text class="baltxt" x="152.80" y="52.75" text-anchor="middle" font-size="3.1">3</text><text class="note" x="159.00" y="52.60" text-anchor="start" font-size="2.7">driver-board rails - the board slides down</text><text class="note" x="159.00" y="56.30" text-anchor="start" font-size="2.7">from the top, stop at the bottom</text><circle class="balloon" cx="152.80" cy="61.80" r="2.80"/><text class="baltxt" x="152.80" y="62.95" text-anchor="middle" font-size="3.1">4</text><text class="note" x="159.00" y="62.80" text-anchor="start" font-size="2.7">USB-C breakout rails; the port opening is</text><text class="note" x="159.00" y="66.50" text-anchor="start" font-size="2.7">through the skin below them</text><circle class="balloon" cx="152.80" cy="72.00" r="2.80"/><text class="baltxt" x="152.80" y="73.15" text-anchor="middle" font-size="3.1">5</text><text class="note" x="159.00" y="73.00" text-anchor="start" font-size="2.7">cell platform, level with the puck face so</text><text class="note" x="159.00" y="76.70" text-anchor="start" font-size="2.7">the cell does not straddle the step, with a</text><text class="note" x="159.00" y="80.40" text-anchor="start" font-size="2.7">1 fence</text><circle class="balloon" cx="152.80" cy="85.90" r="2.80"/><text class="baltxt" x="152.80" y="87.05" text-anchor="middle" font-size="3.1">6</text><text class="note" x="159.00" y="86.90" text-anchor="start" font-size="2.7">module retention pad</text><text class="note" x="166.00" y="164.60" text-anchor="start" font-size="2.35">STLs export flat-face-down and MIRRORED IN X (print_mirror = true)</text><rect class="tbframe" x="166.00" y="167.00" width="96.00" height="18.00" rx="0.00"/><line class="tbrule" x1="166.00" y1="176.00" x2="262.00" y2="176.00"/><line class="tbrule" x1="218.80" y1="176.00" x2="218.80" y2="185.00"/><line class="tbrule" x1="240.88" y1="176.00" x2="240.88" y2="185.00"/><text class="tbname" x="168.00" y="173.12" text-anchor="start" font-size="3.6">BACK COVER</text><te