# Home Assistant app manifest for the eInk image server.
name: eInk Image Server
version: "1.0.8"
slug: eink_image_server
description: Converts photos and generated images into panel-ready blobs for the eInk Daily Dash
url: https://github.com/AStoker/eInk-Projects
arch: [aarch64, amd64]
startup: application
boot: auto
init: false

# Needed to reach Core at http://supervisor/core/api. The agenda builder asks
# for calendar events and writes the assembled day back as a sensor; without
# this the injected SUPERVISOR_TOKEN does not authorize either.
homeassistant_api: true

# Read the source images, write the converted blobs.
map:
  - media:rw

# Published on the HOST, not just the Docker network. The panel is an ESP32 on
# the LAN and cannot reach an internal hostname, so this port has to be real.
ports:
  "8100/tcp": 8100
ports_description:
  "8100/tcp": Where the panel fetches /revision and /next

options:
  photo_rotate_minutes: 15
  scan_seconds: 20
  log_level: INFO
  # The calendars the dash may draw. Opt in by adding one here; nothing joins
  # on its own. Each is then gated at runtime by
  # input_boolean.eink_dash_cal_<slug>, so a calendar can be switched off
  # without editing this list; one with no such helper is simply on.
  agenda_calendars:
    - calendar.bills
    - calendar.family
    - calendar.tricias_routine
  agenda_entity: sensor.esp_day_agenda
  agenda_refresh_minutes: 5
schema:
  photo_rotate_minutes: int(1,1440)
  scan_seconds: int(10,3600)
  log_level: list(DEBUG|INFO|WARNING|ERROR)
  agenda_calendars:
    - str
  agenda_entity: str
  agenda_refresh_minutes: int(1,120)
