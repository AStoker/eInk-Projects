# Adapted from https://github.com/Madelena/esphome-weatherman-dashboard
# And https://blog.wijman.net/e-ink-weather-frame-with-esphome-and-home-assistant/
# With a lot of my own additions, fixes, edits. My github: https://github.com/trip5

substitutions:
  name: eink-weatherboard
  friendly_name: eInk-WeatherBoard
  project_name: "Trip5.eInk-WeatherBoard"
  comment: "eInk-WeatherBoard from Trip5"
  project_version: "2024.11.28"
  time_zone: "America/New_York" # Check https://en.wikipedia.org/wiki/List_of_tz_database_time_zones
  adc_pin: GPIO14 # Can't use ADC with wifi
  adc_gpio: '14'
  sleep_time: 60min # this is the default but is overridden
  max_run_time: 60s # this is the maximum time the ESP32 can run before it goes to sleep (if deep sleep is enabled) - this is to prevent the ESP32 from running too long and draining the battery

# Home Assistant entitites:
  ha_disable_update: input_boolean.eink_weatherboard_disable_update
  ha_disable_deep_sleep: input_boolean.eink_weatherboard_disable_deep_sleep
  ha_weather_data: sensor.eink_weatherboard_data
  ha_wake_times: sensor.eink_weatherboard_wake_times
 
# A physical switch to disable deep sleep (optional, if no physical switch is attached then no problem)
  deep_sleep_disable_pin: GPIO21

# Waveshare eInk Board:
# Using lilygo boards, I don't think we need this
  # status_led_pin: GPIO2 # Don't think we have access to the led pin
  # mosi_pin: GPIO15
  # clk_pin: GPIO12
  # cs_pin: GPIO42
  # dc_pin: GPIO27
  # reset_pin: GPIO26
  # busy_pin: GPIO25
  # busy_inverted: "True" #needed on most newer boards: check ESPHome or component notes

  # Everything here is meant for an 7.5 inch tricolor display, which is (as of 2024.12.0) now directly supported by ESPHome (thanks, JonasB2497!)
  # See here for full list of directly-supported displays: https://esphome.io/components/display/waveshare_epaper.html
  # if using only BW, then you may need to edit colors below (change red to same as black)
  # model: 7.50in-bv3-bwr

esphome:
  name: ${name}
  comment: "${comment}"
  project:
    name: "${project_name}"
    version: "${project_version}"
  on_boot:
      priority: -100.0
      then:
        # - lambda: 'id(recorded_display_refresh) = 1488;' # if you need to manually update the number of refreshes (flash once with a set value then comment the line and reflash again)
        # - script.execute: led_blink
        - wait_until:
            condition: api.connected
        - if:
            condition:
              or:
                - binary_sensor.is_on: deep_sleep_disable_ha # checks Home Assistant Helper
            then:
              - script.execute: deep_sleep_evaluation
            else:
              - script.execute: get_data_then_refresh_screen
  platformio_options:
    # board_dir: boards
    #include https://github.com/Xinyuan-LilyGO/LilyGo-EPD47/blob/master/platformio/boards/lilygo-t5-47-plus.json as custom board
    # board: lilygo-t5-47-plus
    upload_speed: 921600
    monitor_speed: 115200
    board_build.mcu: esp32s3
    board_build.f_cpu: 240000000L
    board_build.arduino.memory_type: qspi_opi
    board_build.flash_size: 4MB
    board_build.flash_mode: qio
    board_build.flash_type: qspi
    board_build.psram_type: opi
    board_build.memory_type: qspi_opi
    board_build.boot_freq: 80m
    build_flags:
      - "-DBOARD_HAS_PSRAM"
      - "-DARDUINO_USB_CDC_ON_BOOT=1"
      - "-mfix-esp32-psram-cache-issue"
  libraries:
    - SPI
  # build_path: /config/esphome/.esphome/forecast-display/

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: arduino
    # CRITICAL for ESP-IDF 5.4.2+: Enable PSRAM initialization (thanks @hbast!)
    sdkconfig_options:
      CONFIG_SPIRAM: "y"
      CONFIG_SPIRAM_MODE_OCT: "y"
      CONFIG_SPIRAM_SPEED_80M: "y"
      CONFIG_SPIRAM_USE_MALLOC: "y"
      CONFIG_SPIRAM_MALLOC_ALWAYSINTERNAL: "16384"
      CONFIG_SPIRAM_TRY_ALLOCATE_WIFI_LWIP: "y"
      CONFIG_ESP32S3_SPIRAM_SUPPORT: "y"
      CONFIG_SPIRAM_BOOT_INIT: "y"
      CONFIG_SPIRAM_IGNORE_NOTFOUND: "n"

preferences:
  flash_write_interval: 5s # default is 1min but seems sometimes id(recorded_display_refresh) doesn't get saved unless this is short

ota:
  - platform: esphome
    password: !secret ota_password_weather

wifi:
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
  fast_connect: True
  ap:
    ssid: ${name}
    password: !secret ap_password

# web_server:
#   port: 80
#   ota: True
#   include_internal: True # probably not necessary, as it will expose more than needed to the Web UI

captive_portal:

# Enable logging (and stops the various sensors/switches from spamming the log) - if you need more data, change to DEBUG
logger:
  level: DEBUG
  logs:
    light: DEBUG
    script: DEBUG
    sensor: DEBUG

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_encryption_weather

button:
  - platform: restart
    name: "${friendly_name} Restart"
    id: "Restart"
    internal: True
  - platform: template
    name: "${friendly_name} Refresh Screen"
    entity_category: config
    on_press:
      - lambda: 'id(data_updated) = true;'
      - script.execute: refresh_screen

# Define colors - this design is white on black so this is necessary
# Since this is monochrome, red is the same as black
color:
  - id: color_blk
    red: 100%
    green: 100%
    blue: 100%
    white: 100%
  - id: color_red
    red: 100%
    green: 100%
    blue: 100%
    white: 100%
  - id: color_bg
    red: 100%
    green: 100%
    blue: 100%
    white: 100%
  - id: color_txt
    red: 0%
    green: 0%
    blue: 0%
    white: 100%


external_components:
  - source: github://dabalroman/esphome-lilygo-t547plus_esphome-2025.11 #github://nickolay/esphome-lilygo-t547plus
    components: ["t547"]
      
# Global variables for detecting if the display needs to be refreshed.
globals:
  - id: data_updated
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: wake_time_helper_updated
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: recorded_display_refresh
    type: int
    restore_value: yes
    initial_value: '0'
  - id: battery_voltage_global
    type: float
    restore_value: yes
    initial_value: '0.0'

number:
  - platform: template
    name: "Delay Time Helper"
    id: delay_time_helper
    internal: true
    step: 1
    min_value: 0
    max_value: 9999999 # This should only be used to calculate how for to delay, shouldn't be more than a few minutes
    optimistic: True

script:
  - id: get_data_then_refresh_screen
    mode: restart
    then:
      - wait_until:
          condition:
            lambda: 'return id(data_updated) == true;'
          timeout: 60s
      - logger.log: "Data updated == true"
      - wait_until: # should wait until the wake_time_helper is actually updated (to evaluate the next condition)
          condition:
            lambda: 'return id(wake_time_helper_updated) == true;'
          timeout: 2min
      - logger.log: "Wake time helper updated, or timeout 2 minutes"
      - if:  # with longer sleep delays, the ESP32 tends to wake up a bit too early... if the wake time is within the next 8 minutes, wait for the scheduled wake time (less 30s) (preventing it from updating twice in a row)
          # Bug: check out line 3670 of logs. Wake time helper set to 0 (caught it right at 0 seconds left), so now it waits for -30 seconds
          condition:
            lambda: 'return (id(wake_time_helper).state <= (8 * 60));'
          then:
            - lambda: |
                int delay_time = (id(wake_time_helper).state - 30) < 0 ? 0 : (id(wake_time_helper).state - 30);
                id(delay_time_helper).publish_state(delay_time);  // Store value for use in logger.log
            - logger.log:
                format: "Woke up too soon (within 8 minutes). Wake Time Helper is set to %.1f seconds. Waiting for %.1f seconds before refreshing display."
                args: ['id(wake_time_helper).state', 'id(delay_time_helper).state']
            - delay: !lambda 'return (id(delay_time_helper).state * 1000);'
      - if:
          condition:
            lambda: 'return id(data_updated) == true;'
          then:
            - delay: 10s # Wait a bit longer so all the items are received. Might need to be more.
            - logger.log: "Sensor data received."
            - script.execute: refresh_screen
          else:
            - logger.log: "No new data. Skipping display refresh."
            - script.execute: deep_sleep_evaluation
  - id: refresh_screen
    mode: restart
    then:
      - if:
          condition:
            binary_sensor.is_off: disable_update
          then:
            - script.execute: check_battery
            - lambda: 'id(recorded_display_refresh) += 1;'
            - lambda: 'id(display_last_update).publish_state(id(homeassistant_time).now().timestamp);'
            - logger.log: "Refreshing display..."
            - component.update: eink_display
            - lambda: 'id(data_updated) = false;'
            - delay: 5s # If deep sleep follows immediately, then we need a short delay here so HA catches the refresh count
          else:
            - logger.log: "Home Assistant Helper 'Disable Update' is on. Skipping display refresh."
      - script.execute: deep_sleep_evaluation
  - id: check_battery
    mode: restart
    then:
      - if:
          condition: wifi.enabled
          then:
            # Disable wifi so we can get battery, then re-enable
            - logger.log: "WiFi is enabled. Disabling WiFi to get battery level..."
            - wifi.disable:
      - delay: 100ms # Allow time for WiFi to disable
        # Now manually get the battery sensor levels
      - logger.log: "Checking battery level..."
      - lambda: |-
          // Read raw ADC value on the defined pin
          int raw = analogRead(${adc_gpio});
          // Apply any calibration factor needed 
          float voltage = raw * 1.84;
          id(battery_voltage_global) = voltage;
          ESP_LOGI("battery", "Battery level: %.2fV", voltage);

          // Read the raw ADC value from the configured pin (e.g., GPIO14)
          int raw_value = analogRead(${adc_gpio});
          // Reference voltage for the ADC (typically 3.3V for ESP32)
          float V_ref = 3.3;
          // Calculate voltage at ADC pin: (ADC will be raw value between 0 and 4095, value will be proportional to the voltage)
          float V_adc = ((float) raw_value / 4095.0) * V_ref;
          // Divider factor from your voltage divider.
          // For example, many Lilygo T5 boards have a divider factor around 1.84.
          float divider_factor = 1.84;
          // Calculate actual battery voltage
          float battery_voltage = V_adc * divider_factor;
          // Trim battery voltage to two decimals:
          battery_voltage = round(battery_voltage * 100.0) / 100.0;
          // Store the computed value in the global variable
          id(battery_voltage_global) = battery_voltage;
          ESP_LOGI("battery", "Raw ADC: %d, ADC Voltage: %.2f V, Battery Voltage: %.2f V", raw_value, V_adc, battery_voltage);
      - logger.log:
          format: "Battery level is %.2fV"
          args: ['id(battery_voltage).state']
      - delay: 1s
      # Finished up, re-nable wifi
      - wifi.enable:
  - id: deep_sleep_evaluation
    # This dynamic deep sleep script inspired by https://webbinaro.dev/blog/battery-powered-esp-sensors-esphome/
    mode: restart
    then:
      - if:
          condition:
            or:
              - binary_sensor.is_on: deep_sleep_disable_ha # checks Home Assistant Helper
          then:
            - logger.log: 'Deep Sleep Disabled.'
            - script.execute: deep_sleep_disabled_check_refresh_time
            - script.execute: check_battery
          else:
            - logger.log:
                format: 'Wake Time Helper is set to %.1f seconds. Waiting for value to be >= 360 before entering deep sleep.'
                args: ['id(wake_time_helper).state']
            - wait_until:
                condition:
                  lambda: 'return (id(wake_time_helper).state >= (6 * 60));'
            - logger.log: 
                format: 'Entering Deep Sleep. Will wake in %.1f seconds...' 
                args: ['id(wake_time_helper).state']
            - deep_sleep.enter:
                id: deep_sleep_control
                sleep_duration: !lambda return id(wake_time_helper).state * 1000;
                # lambdas should return value as ms
      - delay: 60s
      - script.execute: deep_sleep_evaluation
  - id: deep_sleep_disabled_check_refresh_time
    # This will update the screen on the HA helper schedule(ish) even if Deep Sleep is disabled
    mode: restart
    then:
      - if:
          condition:
            - lambda: 'return id(wake_time_helper).state <= 60;'
          then:
            - logger.log: 'Time to refresh the screen.'
            - script.execute: get_data_then_refresh_screen

deep_sleep:
  id: deep_sleep_control
  sleep_duration: ${sleep_time}
  # run_duration: ${max_run_time}

time:
  - platform: homeassistant
    timezone: "${time_zone}"
    id: homeassistant_time
    # if using USB battery, deep sleep is disabled, and more constant refreshes are OK, then you may need this bit:
    #on_time:
    #  - seconds: 0
    #    minutes: 0,15,30,45
    #     then:
    #       - script.execute: get_data_then_refresh_screen

binary_sensor:
  # The following are boolean helpers in Home Assistant
  - platform: homeassistant # This sensor is for Home Assistant helper switch to disable deep sleep, remove if not used
    id: deep_sleep_disable_ha
    name: "${friendly_name} Disable Deep Sleep HA"
    entity_id: '${ha_disable_deep_sleep}'
  - platform: homeassistant # This sensor is for Home Assistant helper switch to disable updates
    id: disable_update
    name: "${friendly_name} Disable Update"
    entity_id: '${ha_disable_update}'

