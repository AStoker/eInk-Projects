text-anchor="start" font-size="3.2"> </text><circle class="balloon" cx="110.80" cy="148.50" r="2.80"/><text class="baltxt" x="110.80" y="149.65" text-anchor="middle" font-size="3.1">5</text><text class="note" x="117.00" y="149.50" text-anchor="start" font-size="2.7">driver-board USB-C, 13 wide - blind pocket,</text><text class="note" x="117.00" y="153.20" text-anchor="start" font-size="2.7">the top wall is solid (2.2 thick, 1.5 of</text><text class="note" x="117.00" y="156.90" text-anchor="start" font-size="2.7">skin left). The charge port is the only</text><text class="note" x="117.00" y="160.60" text-anchor="start" font-size="2.7">opening</text><circle class="balloon" cx="110.80" cy="166.10" r="2.80"/><text class="baltxt" x="110.80" y="167.25" text-anchor="middle" font-size="3.1">6</text><text class="note" x="117.00" y="167.10" text-anchor="start" font-size="2.7">USB-C charge port 9.5 x 3.7, back face</text><circle class="balloon" cx="110.80" cy="172.60" r="2.80"/><text class="baltxt" x="110.80" y="173.75" text-anchor="middle" font-size="3.1">7</text><text class="note" x="117.00" y="173.60" text-anchor="start" font-size="2.7">frame / cover seam</text><text class="vlabel" x="190.00" y="143.00" text-anchor="start" font-size="3.2"> </text><circle class="balloon" cx="192.80" cy="148.50" r="2.80"/><text class="baltxt" x="192.80" y="149.65" text-anchor="middle" font-size="3.1">8</text><text class="note" x="199.00" y="149.50" text-anchor="start" font-size="2.7">4 x cover screws, one near each corner:</text><text class="note" x="199.00" y="153.20" text-anchor="start" font-size="2.7">36.3 from the centreline, 4.5 from each</text><text class="note" x="199.00" y="156.90" text-anchor="start" font-size="2.7">end. M3 heat-set inserts (bore dia 4 x</text><text class="note" x="199.00" y="160.60" text-anchor="start" font-size="2.7">6.7 deep) with countersunk screws</text><circle class="balloon" cx="192.80" cy="166.10" r="2.80"/><text class="baltxt" x="192.80" y="167.25" text-anchor="middle" font-size="3.1">9</text><text class="note" x="199.00" y="167.10" text-anchor="start" font-size="2.7">kickstand disc dia 54, hub 45.95 up</text><text class="note" x="166.00" y="164.60" text-anchor="start" font-size="2.35">STLs export flat-face-down and MIRRORED IN X (print_mirror = true)</text><rect class="tbframe" x="166.00" y="167.00" width="96.00" height="18.00" rx="0.00"/><line class="tbrule" x1="166.00" y1="176.00" x2="262.00" y2="176.00"/><line class="tbrule" x1="218.80" y1="176.00" x2="218.80" y2="185.00"/><line class="tbrule" x1="240.88" y1="176.00" x2="240.88" y2="185.00"/><text class="tbname" x="168.00" y="173.12" text-anchor="start" font-size="3.6">ASSEMBLY / ENVELOPE</text><text class="tbmeta" x="168.00" y="182.30" text-anchor="start" font-size="2.4">UNITS mm &#183; SCALE 1:1</text><text class="tbmeta" x="221.20" y="182.30" text-anchor="start" font-size="2.4">SHEET 1/8</text><text class="tbmeta" x="242.80" y="182.30" text-anchor="start" font-size="2.4">REV E</text></svg>