0" y="82.67" text-anchor="middle" font-size="3.0" transform="rotate(-90 119.60 82.67)">83.65</text><line class="dim" x1="76.95" y1="66.50" x2="86.95" y2="58.50"/><path class="arrow" d="M76.95,66.50 L77.88,65.10 L78.52,65.90 Z"/><circle class="balloon" cx="86.95" cy="58.50" r="2.80"/><text class="baltxt" x="86.95" y="59.65" text-anchor="middle" font-size="3.1">1</text><line class="dim" x1="78.45" y1="121.60" x2="92.45" y2="118.60"/><path class="arrow" d="M78.45,121.60 L79.91,120.76 L80.12,121.77 Z"/><circle class="balloon" cx="92.45" cy="118.60" r="2.80"/><text class="baltxt" x="92.45" y="119.75" text-anchor="middle" font-size="3.1">8</text><line class="dim" x1="40.35" y1="32.40" x2="26.35" y2="24.40"/><path class="arrow" d="M40.35,32.40 L38.71,32.05 L39.21,31.16 Z"/><circle class="balloon" cx="26.35" cy="24.40" r="2.80"/><text class="baltxt" x="26.35" y="25.55" text-anchor="middle" font-size="3.1">9</text><line class="dim" x1="90.10" y1="31.20" x2="102.10" y2="46.85"/><path class="arrow" d="M90.10,31.20 L91.48,32.16 L90.67,32.78 Z"/><circle class="balloon" cx="102.10" cy="46.85" r="2.80"/><text class="baltxt" x="102.10" y="48.00" text-anchor="middle" font-size="3.1">2</text><line class="dim" x1="54.50" y1="108.00" x2="67.50" y2="102.00"/><path class="arrow" d="M54.50,108.00 L55.74,106.86 L56.17,107.79 Z"/><circle class="balloon" cx="67.50" cy="102.00" r="2.80"/><text class="baltxt" x="67.50" y="103.15" text-anchor="middle" font-size="3.1">3</text><line class="dim" x1="62.95" y1="30.10" x2="49.95" y2="24.15"/><path class="arrow" d="M62.95,30.10 L61.28,29.90 L61.71,28.97 Z"/><circle class="balloon" cx="49.95" cy="24.15" r="2.80"/><text class="baltxt" x="49.95" y="25.30" text-anchor="middle" font-size="3.1">4</text><line class="dim" x1="74.30" y1="55.80" x2="65.30" y2="47.80"/><path class="arrow" d="M74.30,55.80 L72.76,55.12 L73.44,54.35 Z"/><circle class="balloon" cx="65.30" cy="47.80" r="2.80"/><text class="baltxt" x="65.30" y="48.95" text-anchor="middle" font-size="3.1">5</text><line class="dim" x1="108.40" y1="119.00" x2="94.40" y2="113.00"/><path class="arrow" d="M108.40,119.00 L106.73,118.84 L107.13,117.90 Z"/><circle class="balloon" cx="94.40" cy="113.00" r="2.80"/><text class="baltxt" x="94.40" y="114.15" text-anchor="middle" font-size="3.1">6</text><text class="vlabel" x="150.00" y="22.00" text-anchor="start" font-size="3.2">NOTES</text><circle class="balloon" cx="152.80" cy="27.50" r="2.80"/><text class="baltxt" x="152.80" y="28.65" text-anchor="middle" font-size="3.1">1</text><text class="note" x="159.00" y="28.50" text-anchor="start" font-size="2.7">stand recess in the BACK face, hidden here because</text><text class="note" x="159.00" y="32.20" text-anchor="start" font-size="2.7">it does not break through: 18 wide x 4.5 deep,</text><text class="note" x="159.00" y="35.90" text-anchor="start" font-size="2.7">stepping to 1.4 below z 11.3. Pin sockets are on</text><text class="note" x="159.00" y="39.60" text-anchor="start" font-size="2.7">EARS inside it, not bored through its walls -</text><text class="note" x="159.00" y="43.30" text-anchor="start" font-size="2.7">sheet 6</text><circle class="balloon" cx="152.80" cy="48.80" r="2.80"/><text class="baltxt" x="152.80" y="49.95" text-anchor="middle" font-size="3.1">2</text><text class="note" x="159.00" y="49.80" text-anchor="start" font-size="2.7">four dia 6.5 posts under the bq25185 charger, 25 x</text><text class="note" x="159.00" y="53.50" text-anchor="start" font-size="2.7">19.3 centres, 3.8 off the register face, bored dia</text><text class="note" x="159.00" y="57.20" text-anchor="start" font-size="2.7">2.9 x 5 for M2 inserts. BLIND, 1.2 of skin.</text><text class="note" x="159.00" y="60.90" text-anchor="start" font-size="2.7">Centres ASSUMED - measure the board</text><circle class="balloon" cx="152.80" cy="66.40" r="2.80"/><text class="baltxt" x="152.80" y="67.55" text-anchor="middle" font-size="3.1">3</text><text class="note" x="159.00" y="67.40" text-anchor="start" font-size="2.7">four carrier mounts: a dia 4 PAD 2.5 tall - the</text><text class="note" x="159.00" y="71.10" text-anchor="start" font-size="2.7">air the solder joints under the board need -</text><text class="note" x="159.00" y="74.80" text-anchor="start" font-size="2.7">carrying a dia 1.85 PEG that locates it through</text><text class="note" x="159.00" y="78.50" text-anchor="start" font-size="2.7">its hole</text><circle class="balloon" cx="152.80" cy="84.00" r="2.80"/><text class="baltxt" x="152.80" y="85.15" text-anchor="middle" font-size="3.1">4</text><text class="note" x="159.00" y="85.00" text-anchor="start" font-size="2.7">USB-C charge port, opening 13.6 x 6.3 at x -5 z</text><text class="note" x="159.00" y="88.70" text-anchor="start" font-size="2.7">91.35: a snap-in pigtail, nothing printed around</text><text class="note" x="159.00" y="92.40" text-anchor="start" font-size="2.7">it. The height gets the bigger clearance - it is</text><text class="note" x="159.00" y="96.10" text-anchor="start" font-size="2.7">the tight axis</text><circle class="balloon" cx="152.80" cy="101.60" r="2.80"/><text class="baltxt" x="152.80" y="102.75" text-anchor="middle" font-size="3.1">5</text><text class="note" x="159.00" y="102.60" text-anchor="start" font-size="2.7">cell platform at depth 18.7, level with the back</text><text class="note" x="159.00" y="106.30" text-anchor="start" font-size="2.7">of the recess floor so the cell does not straddle</text><text class="note" x="159.00" y="110.00" text-anchor="start" font-size="2.7">the step, 1 fence</text><circle class="balloon" cx="152.80" cy="115.50" r="2.80"/><text class="baltxt" x="152.80" y="116.65" text-anchor="middle" font-size="3.1">6</text><text class="note" x="159.00" y="116.50" text-anchor="start" font-size="2.7">the four corner screw holes, counterbored</text><circle class="balloon" cx="152.80" cy="122.00" r="2.80"/><text class="baltxt" x="152.80" y="123.15" text-anchor="middle" font-size="3.1">9</text><text class="note" x="159.00" y="123.00" text-anchor="start" font-size="2.7">two dia 8.2 x 2.2 BLIND pockets for dia 8 x 2</text><text class="note" x="159.00" y="126.70" text-anchor="start" font-size="2.7">discs, each on a dia 11.2 boss 1.8 proud, leaving</text><text class="note" x="159.00" y="130.40" text-anchor="start" font-size="2.7">2 in front. MIRRORED at x +/-27.6 so the pair's</text><text class="note" x="159.00" y="134.10" text-anchor="start" font-size="2.7">centroid is on the centreline; offset, they hang</text><text class="note" x="159.00" y="137.80" text-anchor="start" font-size="2.7">it crooked. The two z differ - the -X half is</text><text class="note" x="159.00" y="141.50" text-anchor="start" font-size="2.7">carrier board to z 84.5</text><circle class="balloon" cx="152.80" cy="147.00" r="2.80"/><text class="baltxt" x="152.80" y="148.15" text-anchor="middle" font-size="3.1">8</text><text class="note" x="159.00" y="148.00" text-anchor="start" font-size="2.7">the register extension, 21 wide, FLOORS the</text><text class="note" x="159.00" y="151.70" text-anchor="start" font-size="2.7">shallow end of the recess. It plugs a frame relief</text><text class="note" x="159.00" y="155.40" text-anchor="start" font-size="2.7">0.15 larger, so it STOPS at z 1.9 - clear of the</text><text class="note" x="159.00" y="159.10" text-anchor="start" font-size="2.7">0.6 the rear chamfer takes</text><text class="note" x="166.00" y="164.60" text-anchor="start" font-size="2.35">STLs export flat-face-down, as drawn (print_mirror = false)</text><rect class="tbframe" x="166.00" y="167.00" width="96.00" height="18.00" rx="0.00"/><line class="tbrule" x1="166.00" y1="176.00" x2="262.00" y2="176.00"/><line class="tbrule" x1="218.80" y1="176.00" x2="218.80" y2="185.00"/><line class="tbrule" x1="240.88" y1="176.00" x2="240.88" y2="185.00"/><text class="tbname" x="168.00" y="173.12" text-anchor="start" font-size="3.6">BACK COVER</text><text class="tbmeta" x="168.00" y="182.30" text-anchor="start" font-size="2.4">UNITS mm &#183; SCALE 1:1</text><text class="tbmeta" x="221.20" y="182.30" text-anchor="start" font-size="2.4">SHEET 5/8</text><text class="tbmeta" x="242.80" y="182.30" text-anchor="start" font-size="2.4">REV E</text></svg>