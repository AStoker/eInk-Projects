# ============================================================================
# IMAGE MODES -- where pictures come from
# ============================================================================
# The e-ink app converts photos and generated images into panel-ready blobs and
# serves them; this package is only the client. The whole image path on the
# device is components/eink_blob -- no decoder, no scaler, and never more than
# one row of the picture in RAM. Format and app contract: IMAGE-PIPELINE.md.
#
# Mode comes from ${ha_mode_select}. Anything that is not
# "${dash_option}" is passed to the app as-is, so adding a mode is a change to
# the input_select and the app, not to this firmware.
#
# Defines: display_mode, image_revision, blob_fetcher.
# Consumed by: packages/sleep.yaml (the revision check) and
#              packages/display.yaml (the blit).
# ============================================================================

text_sensor:
  - platform: homeassistant
    id: display_mode
    entity_id: ${ha_mode_select}
    internal: true
    on_value:
      # Home Assistant re-pushes this on every reconnect, so a bare on_value
      # would force a refresh every single wake. Only a value that differs from
      # the one last drawn counts as a mode change.
      - if:
          condition:
            lambda: |-
              return !id(last_mode).empty() && x != id(last_mode);
          then:
            - logger.log:
                format: "Mode changed %s -> %s; redrawing"
                args: ['id(last_mode).c_str()', 'x.c_str()']
            - lambda: 'id(force_refresh) = true;'
            - script.execute: wake_cycle

globals:
  # The last revision actually painted. Survives deep sleep, which is the whole
  # point: the comparison that decides whether to spend a refresh happens
  # across a sleep, not within one wake.
  - id: image_revision
    type: std::string
    restore_value: true
    max_restore_data_length: 32
    initial_value: '""'
  # What was on the panel last time it drew. Survives sleep, so waking up to a
  # mode someone changed while the board was down still counts as a change.
  - id: last_mode
    type: std::string
    restore_value: true
    max_restore_data_length: 16
    initial_value: '""'
  # Set by the Refresh button and by a mode change. Draw regardless of whether
  # the picture changed: a person pressing refresh is asking for a redraw, not
  # for an opinion about whether one is needed.
  - id: force_refresh
    type: bool
    restore_value: false
    initial_value: 'false'

eink_blob:
  id: blob_fetcher
  timeout: 20s
