.20" y2="69.70"/><line class="ext" x1="93.75" y1="118.70" x2="115.20" y2="118.70"/><line class="dim" x1="114.00" y1="69.70" x2="114.00" y2="118.70"/><path class="arrow" d="M114.00,69.70 L114.51,71.30 L113.49,71.30 Z"/><path class="arrow" d="M114.00,118.70 L113.49,117.10 L114.51,117.10 Z"/><text class="dimtxt" x="112.70" y="94.20" text-anchor="middle" font-size="3.0" transform="rotate(-90 112.70 94.20)">49</text><line class="ext" x1="111.50" y1="16.20" x2="125.20" y2="16.20"/><line class="ext" x1="111.50" y1="120.20" x2="125.20" y2="120.20"/><line class="dim" x1="124.00" y1="16.20" x2="124.00" y2="120.20"/><path class="arrow" d="M124.00,16.20 L124.51,17.80 L123.49,17.80 Z"/><path class="arrow" d="M124.00,120.20 L123.49,118.60 L124.51,118.60 Z"/><text class="dimtxt" x="122.70" y="68.20" text-anchor="middle" font-size="3.0" transform="rotate(-90 122.70 68.20)">104</text><line class="dim" x1="40.55" y1="111.40" x2="9.00" y2="120.40"/><path class="arrow" d="M40.55,111.40 L39.15,112.33 L38.87,111.35 Z"/><circle class="balloon" cx="9.00" cy="120.40" r="2.80"/><text class="baltxt" x="9.00" y="121.55" text-anchor="middle" font-size="3.1">1</text><line class="dim" x1="103.05" y1="96.20" x2="133.00" y2="100.00"/><path class="arrow" d="M103.05,96.20 L104.70,95.89 L104.57,96.91 Z"/><circle class="balloon" cx="133.00" cy="100.00" r="2.80"/><text class="baltxt" x="133.00" y="101.15" text-anchor="middle" font-size="3.1">2</text><line class="dim" x1="91.36" y1="97.33" x2="132.00" y2="119.00"/><path class="arrow" d="M91.36,97.33 L93.01,97.63 L92.53,98.53 Z"/><circle class="balloon" cx="132.00" cy="119.00" r="2.80"/><text class="baltxt" x="132.00" y="120.15" text-anchor="middle" font-size="3.1">3</text><line class="dim" x1="54.10" y1="24.80" x2="12.00" y2="27.80"/><path class="arrow" d="M54.10,24.80 L52.54,25.42 L52.47,24.40 Z"/><circle class="balloon" cx="12.00" cy="27.80" r="2.80"/><text class="baltxt" x="12.00" y="28.95" text-anchor="middle" font-size="3.1">4</text><line class="dim" x1="35.50" y1="40.70" x2="10.00" y2="46.00"/><path class="arrow" d="M35.50,40.70 L34.04,41.53 L33.83,40.52 Z"/><circle class="balloon" cx="10.00" cy="46.00" r="2.80"/><text class="baltxt" x="10.00" y="47.15" text-anchor="middle" font-size="3.1">5</text><line class="dim" x1="106.36" y1="25.33" x2="132.00" y2="40.00"/><path class="arrow" d="M106.36,25.33 L108.00,25.68 L107.49,26.56 Z"/><circle class="balloon" cx="132.00" cy="40.00" r="2.80"/><text class="baltxt" x="132.00" y="41.15" text-anchor="middle" font-size="3.1">6</text><line class="dim" x1="81.75" y1="112.70" x2="133.00" y2="113.00"/><path class="arrow" d="M81.75,112.70 L83.35,112.20 L83.35,113.22 Z"/><circle class="balloon" cx="133.00" cy="113.00" r="2.80"/><text class="baltxt" x="133.00" y="114.15" text-anchor="middle" font-size="3.1">7</text><text class="vlabel" x="74.95" y="9.00" text-anchor="middle" font-size="3.0">LOOKING INTO THE OPEN BACK</text><text class="vlabel" x="150.00" y="20.00" text-anchor="start" font-size="3.2">NOTES</text><circle class="balloon" cx="152.80" cy="25.50" r="2.80"/><text class="baltxt" x="152.80" y="26.65" text-anchor="middle" font-size="3.1">1</text><text class="note" x="159.00" y="26.50" text-anchor="start" font-size="2.7">USB-C charge breakout, on edge in printed rails,</text><text class="note" x="159.00" y="30.20" text-anchor="start" font-size="2.7">receptacle flush with the back cover. Two wires up the</text><text class="note" x="159.00" y="33.90" text-anchor="start" font-size="2.7">-X wall to the bq24074</text><circle class="balloon" cx="152.80" cy="39.40" r="2.80"/><text class="baltxt" x="152.80" y="40.55" text-anchor="middle" font-size="3.1">2</text><text class="note" x="159.00" y="40.40" text-anchor="start" font-size="2.7">module retention pads 13 x 22, one each side of the</text><text class="note" x="159.00" y="44.10" text-anchor="start" font-size="2.7">cell. Foam tape on the faces takes up the tolerance</text><text class="note" x="159.00" y="47.80" text-anchor="start" font-size="2.7">stack</text><circle class="balloon" cx="152.80" cy="53.30" r="2.80"/><text class="baltxt" x="152.80" y="54.45" text-anchor="middle" font-size="3.1">3</text><text class="note" x="159.00" y="54.30" text-anchor="start" font-size="2.7">stand puck, dia 63.3, bulges 5.95 into the interior</text><text class="note" x="159.00" y="58.00" text-anchor="start" font-size="2.7">behind everything on this sheet</text><circle class="balloon" cx="152.80" cy="63.50" r="2.80"/><text class="baltxt" x="152.80" y="64.65" text-anchor="middle" font-size="3.1">4</text><text class="note" x="159.00" y="64.50" text-anchor="start" font-size="2.7">2 x M2.5 posts, 35.6 apart, behind the Perma-Proto; the</text><text class="note" x="159.00" y="68.20" text-anchor="start" font-size="2.7">bq24074 rides on its front face</text><circle class="balloon" cx="152.80" cy="73.70" r="2.80"/><text class="baltxt" x="152.80" y="74.85" text-anchor="middle" font-size="3.1">5</text><text class="note" x="159.00" y="74.70" text-anchor="start" font-size="2.7">bq25185 charger breakout 32 x 26.3 x 7.2, low end of the</text><text class="note" x="159.00" y="78.40" text-anchor="start" font-size="2.7">Perma-Proto, nearest the charge port</text><circle class="balloon" cx="152.80" cy="83.90" r="2.80"/><text class="baltxt" x="152.80" y="85.05" text-anchor="middle" font-size="3.1">6</text><text class="note" x="159.00" y="84.90" text-anchor="start" font-size="2.7">driver-board rails 3 wide, overlapping the PCB 2 each</text><text class="note" x="159.00" y="88.60" text-anchor="start" font-size="2.7">side</text><circle class="balloon" cx="152.80" cy="94.10" r="2.80"/><text class="baltxt" x="152.80" y="95.25" text-anchor="middle" font-size="3.1">7</text><text class="note" x="159.00" y="95.10" text-anchor="start" font-size="2.7">MODULE 8-PIN HEADER KEEP-OUT 20 x 7 x 9 deep, position</text><text class="note" x="159.00" y="98.80" text-anchor="start" font-size="2.7">ASSUMED. Clashes with the cell by 1.1 - DO NOT PRINT,</text><text class="note" x="159.00" y="102.50" text-anchor="start" font-size="2.7">see below</text><text class="vlabel" x="150.00" y="111.00" text-anchor="start" font-size="3.2">MEASURE BEFORE YOU PRINT</text><text class="note" x="150.00" y="117.00" text-anchor="start" font-size="2.65">Three numbers on the module settle this sheet:</text><text class="note" x="150.00" y="123.50" text-anchor="start" font-size="2.65">a   header edge, and where across X</text><text class="val" x="157.00" y="127.20" text-anchor="start" font-size="2.65">conn_dz, conn_dx</text><text class="note" x="150.00" y="130.90" text-anchor="start" font-size="2.65">b   header stand-off, mated, with the bend</text><text class="val" x="157.00" y="134.60" text-anchor="start" font-size="2.65">conn_h  (assumed 9)</text><text class="note" x="150.00" y="138.30" text-anchor="start" font-size="2.65">c   is the glass centred on the PCB in Z?</text><text class="val" x="157.00" y="142.00" text-anchor="start" font-size="2.65">pan_off_z, act_off_z</text><text class="note" x="150.00" y="147.00" text-anchor="start" font-size="2.65">The board band clears a 9 mm header (12.7 available);</text><text class="note" x="150.00" y="150.80" text-anchor="start" font-size="2.65">the cell band does not (7.9). If the header is on</text><text class="note" x="150.00" y="154.60" text-anchor="start" font-size="2.65">the cell's edge the two bands swap, which also</text><text class="note" x="150.00" y="158.40" text-anchor="start" font-size="2.65">moves the flash port to the opposite wall. Or</text><text class="note" x="150.00" y="162.20" text-anchor="start" font-size="2.65">keep this layout and set depth = 26.6.</text><text class="note" x="166.00" y="164.60" text-anchor="start" font-size="2.35">STLs export flat-face-down and MIRRORED IN X (print_mirror = true)</text><rect class="tbframe" x="166.00" y="167.00" width="96.00" height="18.00" rx="0.00"/><line class="tbrule" x1="166.00" y1="176.00" x2="262.00" y2="176.00"/><line class="tbrule" x1="218.80" y1="176.00" x2="218.80" y2="185.00"/><line class="tbrule" x1="240.88" y1="176.00" x2="240.88" y2="185.00"/><text class="tbname" x="168.00" y="173.12" text-anchor="start" font-size="3.6">INTERNAL LAYOUT</text><text class="tbmeta" x="168.00" y="182.30" text-anchor="start" font-size="2.4">UNITS mm &#183; SCALE 1:1</text><text class="tbmeta" x="221.20" y="182.30" text-anchor="start" font-size="2.4">SHEET 2/8</text><text class="tbmeta" x="242.80" y="182.30" text-anchor="start" font-size="2.4">REV E</text></svg>