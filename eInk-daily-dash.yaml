# ============================================================================
# eInk Daily Dash -- today's date + today's agenda, portrait
# ============================================================================
# Waveshare 4.2in e-Paper (B) V2 (400x300 black/white/red) on the Waveshare
# e-Paper ESP32 Driver Board. Rotated 90 deg, so the drawing canvas is
# 300 wide x 400 tall (PORTRAIT).
#
#   SPI:     CLK = GPIO13, MOSI = GPIO14   (non-standard pins)
#   Control: CS  = GPIO15, DC   = GPIO27, RST = GPIO26, BUSY = GPIO25
#
# Driver: https://github.com/astoker/esphome-waveshare-4in2b-v2
#   ESPHome's built-in 4.20in-bV2-bwr only drives the OLD panel revision.
#   This component auto-detects OLD (0x10/0x13, busy LOW) vs NEW (0x24/0x26,
#   busy HIGH) at boot -- no busy_pin inversion or reset_duration override.
#
# Panel is full-refresh only (~16-17 s), so it redraws on a timer + whenever
# fresh calendar data arrives, never faster.
#
# ----------------------------------------------------------------------------
# LAYOUT
# ----------------------------------------------------------------------------
#   19  WEDNESDAY          <- header is side-by-side, not stacked: it costs
#       August 2026           64 px instead of 176, leaving ~300 px for events
#   ------------------------
#   o 11:00 AM  -Lunch-       hollow dot + RED strike = finished
#   | 1:30 PM   Dentist       red bar + red text      = happening now
#   * 3:00 PM   Pickup        filled dot              = still ahead
#
# Red carries the date, the month line, the live event, and the cross-off on
# finished events. The weekday is deliberately black so the red date reads as
# the focal point.
#   ------------------------
#   4 of 6 left  (scrolled)          3:42 PM
#
# SCROLLING: the whole day is shown whenever it fits. When it does not, only
# then are FINISHED events dropped off the top, oldest first, until the
# upcoming ones fit -- so the panel never hides something still ahead in order
# to keep history. Row heights are measured before anything is drawn, since
# that decision needs the full list's height up front. "(scrolled)" in the
# footer means events were dropped; "+N more later" means the day overflows
# the bottom even with all history dropped.
#
# ----------------------------------------------------------------------------
# REQUIRED HOME ASSISTANT SETUP
# ----------------------------------------------------------------------------
# This reads sensor.esp_day_agenda's "entries" attribute: a JSON array of
# TODAY's events across your calendars, already sorted by start time. Install
# the template sensor from eink-three-color/ha-daily-agenda-template.yaml
# (it fans out over calendar.family / andrew / work / bills / meals /
# boys_school / judah_school / tricias_routine / gardening).
#
# An attribute, not the state, because HA caps entity states at 255 chars and
# a full day of events blows past that.
#
# Event JSON shape (one object per event):
#   {"s":"Dentist","t":"9:30 AM","a":false,"m":570,"n":615}
#     s = summary   t = display time   a = true if all-day (JSON bool, not 1/0)
#     m = start minutes past local midnight   n = end minutes (-1 for all-day)
#
# Without that sensor the panel still shows the date and renders
# "Nothing scheduled today".
# ============================================================================

esphome:
  name: eink-daily-dash
  friendly_name: "eInk Daily Dash"
  min_version: 2024.11.0
  on_boot:
    priority: -100
    then:
      - script.execute: refresh_loop

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret eink_daily_dash__api_encryption

ota:
  - platform: esphome
    password: !secret eink_daily_dash__ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "eInk-Daily-Dash"
    password: !secret ap_password

captive_portal:

# Declaring json: sets USE_JSON, which pulls in <ArduinoJson.h> for the
# deserializeJson() call in the display lambda.
json:

external_components:
  - source:
      type: git
      url: https://github.com/astoker/esphome-waveshare-4in2b-v2
      ref: main
    components: [waveshare_4in2b_v2]
    refresh: 0s

spi:
  clk_pin: GPIO13
  mosi_pin: GPIO14

# ----------------------------------------------------------------------------
# CLOCK
# ----------------------------------------------------------------------------
# SNTP first, deliberately. The `homeassistant` platform pulls time over the
# API, so before this node is adopted in HA it has no clock at all and the
# panel can only render "Waiting for clock..." -- it cannot even show today's
# date. SNTP needs nothing but Wi-Fi, so the date block always works and only
# the agenda depends on HA.
#
# Both platforms write the same system clock, and RealTimeClock::now() reads
# that clock, so `sys_time` reports valid time from whichever source lands
# first and HA silently keeps it trued up afterwards.
#
# The timezone is explicit because SNTP has no HA to learn it from; ESPHome
# would otherwise bake in whatever timezone the *build machine* had. It must
# match HA's, or the "happening now" highlighting drifts -- the m/n fields are
# minutes past HA-local midnight.
time:
  - platform: sntp
    id: sys_time
    timezone: America/New_York
    servers:
      - 0.pool.ntp.org
      - 1.pool.ntp.org
      - 2.pool.ntp.org
    on_time:
      # Redraw right after midnight so the date rolls over promptly.
      - seconds: 30
        minutes: 0
        hours: 0
        then:
          - script.execute: refresh_loop
  - platform: homeassistant
    id: ha_time

globals:
  - id: refresh_interval_s
    type: int
    restore_value: false
    initial_value: '900'          # 15 min -- panel needs ~17 s per full refresh
  - id: initial_sync_pending
    type: bool
    restore_value: false
    initial_value: 'true'
  # Degraded-mode bookkeeping. E-paper has a finite refresh budget and every
  # redraw here is a ~15 s full-panel cycle, so a stuck feed must not turn into
  # an indefinite 1-minute redraw loop.
  - id: data_ready
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: degraded_drawn
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: degraded_attempts
    type: int
    restore_value: false
    initial_value: '0'

# ----------------------------------------------------------------------------
# DATA SOURCE
# ----------------------------------------------------------------------------
# Subscribe to the ATTRIBUTE, not the state. A calendar entity's state is just
# "on"/"off" and never JSON, which is the trap that makes a naive
# `entity_id: calendar.family` config draw nothing at all.
text_sensor:
  - platform: homeassistant
    id: agenda_json
    entity_id: sensor.esp_day_agenda
    attribute: entries
    internal: true
    on_value:
      # Draw as soon as fresh data lands, then let the timer take over.
      - script.execute: refresh_loop

button:
  - platform: template
    name: "Refresh Display"
    on_press:
      - script.execute: refresh_loop

display:
  - platform: waveshare_4in2b_v2
    id: epaper_display
    cs_pin: GPIO15
    dc_pin: GPIO27
    reset_pin: GPIO26
    busy_pin: GPIO25               # polarity auto-detected by the component
    model: auto                    # auto | old | new
    auto_clear_enabled: false      # clear() fills COLOR_OFF = black ink here
    rotation: 90°                  # -> portrait, 300 x 400 canvas
    update_interval: never         # driven by refresh_loop only
    lambda: |-
      const auto WHITE = Color(255, 255, 255);
      const auto BLACK = Color(0, 0, 0);
      const auto RED   = Color(255, 0, 0);

      const int W = 300;   // canvas width  after 90° rotation
      const int H = 400;   // canvas height after 90° rotation

      it.fill(WHITE);

      auto now = id(sys_time).now();
      if (!now.is_valid()) {
        // Name the actual blocker. SNTP covers the no-HA case, so reaching
        // here means neither NTP nor the API is getting through.
        bool wifi_up = esphome::wifi::global_wifi_component != nullptr &&
                       esphome::wifi::global_wifi_component->is_connected();
        it.print(W / 2, 150, id(font_title_17), BLACK,
                 TextAlign::TOP_CENTER, "Waiting for clock...");
        it.printf(W / 2, 178, id(font_small_11), BLACK, TextAlign::TOP_CENTER,
                  "wifi %s   /   api %s", wifi_up ? "up" : "down",
                  api_is_connected() ? "up" : "down");
        return;
      }

      // --- text width helper -----------------------------------------------
      auto text_w = [&](esphome::font::Font *f, const std::string &s) -> int {
        int w = 0, x = 0, bl = 0, h = 0;
        f->measure(s.c_str(), &w, &x, &bl, &h);
        return w;
      };

      // --- word wrap ---------------------------------------------------------
      // Measure-only, so row heights are known BEFORE anything is drawn. The
      // scroll logic needs the full list's height up front to decide how many
      // past events to drop, which a draw-as-you-go wrapper cannot provide.
      auto wrap_lines = [&](esphome::font::Font *f, const char *text,
                            int maxw, int max_lines) -> std::vector<std::string> {
        std::vector<std::string> lines;
        std::string cur, word;
        const char *p = (text != nullptr) ? text : "";
        auto flush_word = [&]() {
          if (word.empty()) return;
          std::string cand = cur.empty() ? word : cur + " " + word;
          if (text_w(f, cand) > maxw && !cur.empty()) {
            lines.push_back(cur);
            cur = word;
          } else {
            cur = cand;
          }
          word.clear();
        };
        while (*p) {
          if (*p == ' ' || *p == '\n' || *p == '\r' || *p == '\t') flush_word();
          else word += *p;
          p++;
        }
        flush_word();
        if (!cur.empty()) lines.push_back(cur);
        if (lines.empty()) lines.push_back("");

        if ((int) lines.size() > max_lines) {
          std::string last = lines[max_lines - 1];
          while (!last.empty() && text_w(f, last + "...") > maxw)
            last.erase(last.size() - 1);
          lines.resize(max_lines);
          lines[max_lines - 1] = last + "...";
        }
        return lines;
      };

      // ══════════════════════════════════════════════════════════════════
      // HEADER -- compact, side-by-side
      // ══════════════════════════════════════════════════════════════════
      // Laid out horizontally on purpose: the earlier stacked header burned
      // ~176 px of a 400 px canvas on three lines of date. This does the same
      // job in 64 px and hands the rest to the agenda.
      const char *dow_names[]   = {"SUNDAY", "MONDAY", "TUESDAY", "WEDNESDAY",
                                   "THURSDAY", "FRIDAY", "SATURDAY"};
      const char *month_names[] = {"January", "February", "March", "April",
                                   "May", "June", "July", "August",
                                   "September", "October", "November", "December"};

      int dow = now.day_of_week - 1;              // ESPTime: 1 = Sunday
      if (dow < 0 || dow > 6) dow = 0;
      int mon = now.month - 1;
      if (mon < 0 || mon > 11) mon = 0;

      // The date and the month line carry the red ink; the weekday stays
      // black. This replaced an earlier weekend-only red weekday, which would
      // now just read as noise next to a permanently red date.
      it.printf(14, 2, id(font_day_54), RED,
                TextAlign::TOP_LEFT, "%d", now.day_of_month);
      it.print(84, 10, id(font_dow_22), BLACK,
               TextAlign::TOP_LEFT, dow_names[dow]);
      it.printf(84, 38, id(font_sub_15), RED,
                TextAlign::TOP_LEFT, "%s %d", month_names[mon], now.year);

      it.line(14, 66, W - 14, 66, BLACK);

      // ══════════════════════════════════════════════════════════════════
      // TODAY'S EVENTS
      // ══════════════════════════════════════════════════════════════════
      const int MARK_X  = 10;   // status dot / live bar
      const int TIME_X  = 20;   // "9:30 AM" / "ALL DAY"
      const int TITLE_X = 88;   // wrapped summary
      const int TITLE_W = W - TITLE_X - 10;
      const int LINE_H  = 18;
      const int ROW_GAP = 6;
      const int Y_TOP   = 76;
      const int Y_MAX   = 374;  // leave room for the footer
      const int AVAIL   = Y_MAX - Y_TOP;

      int now_min = now.hour * 60 + now.minute;
      bool have_agenda = false;

      struct Row {
        std::string time_txt;
        std::vector<std::string> lines;
        bool all_day;
        bool live;
        bool past;
        int  height;
      };
      std::vector<Row> rows;

      if (id(agenda_json).has_state()) {
        std::string js = id(agenda_json).state;
        if (js.length() > 2 && js != "unknown" && js != "unavailable") {
          JsonDocument doc;
          DeserializationError err = deserializeJson(doc, js);
          if (err) {
            ESP_LOGW("agenda", "JSON parse error: %s", err.c_str());
          } else if (doc.is<JsonArray>()) {
            have_agenda = true;
            for (JsonVariant ev : doc.as<JsonArray>()) {
              const char *summary = ev["s"] | "(no title)";
              const char *tdisp   = ev["t"] | "";
              bool all_day        = ev["a"] | false;
              int  m_start        = ev["m"] | 0;
              int  m_end          = ev["n"] | 0;

              Row r;
              r.all_day  = all_day;
              r.live     = !all_day && now_min >= m_start && now_min < m_end;
              r.past     = !all_day && !r.live && now_min >= m_end;
              r.time_txt = all_day ? "ALL DAY" : std::string(tdisp);
              r.lines    = wrap_lines(id(font_title_17), summary, TITLE_W, 2);
              r.height   = (int) r.lines.size() * LINE_H + ROW_GAP;
              rows.push_back(r);
            }
          }
        }
      }

      // --- scroll: drop finished events off the top only when they crowd out
      // --- something still upcoming. A day that fits stays whole.
      int n = (int) rows.size();
      int first_upcoming = 0;
      while (first_upcoming < n && rows[first_upcoming].past) first_upcoming++;

      auto height_from = [&](int start) -> int {
        int h = 0;
        for (int i = start; i < n; i++) h += rows[i].height;
        return h;
      };

      int start = 0;
      while (start < first_upcoming && height_from(start) > AVAIL) start++;

      // --- draw the window --------------------------------------------------
      int y = Y_TOP;
      int drawn = 0;
      for (int i = start; i < n; i++) {
        const Row &r = rows[i];
        if (y + r.height > Y_MAX + ROW_GAP) break;

        Color c = r.live ? RED : BLACK;

        // Marker: red bar = happening now, filled dot = still ahead,
        // hollow dot = already done.
        if (r.live) {
          it.filled_rectangle(MARK_X - 4, y, 4, LINE_H, RED);
        } else if (r.past) {
          it.circle(MARK_X, y + 8, 3, BLACK);
        } else {
          it.filled_circle(MARK_X, y + 8, 3, BLACK);
        }

        it.print(TIME_X, y + 2, id(font_time_14), c,
                 TextAlign::TOP_LEFT, r.time_txt.c_str());

        for (int k = 0; k < (int) r.lines.size(); k++) {
          it.print(TITLE_X, y + k * LINE_H, id(font_title_17), c,
                   TextAlign::TOP_LEFT, r.lines[k].c_str());
        }

        // Strike through finished events, in red so it reads as a deliberate
        // cross-off rather than an underline. Red now marks two states, but
        // they stay distinct: live is red TEXT plus a red bar, done is black
        // text with only the rule struck through it.
        if (r.past) {
          int sw = text_w(id(font_title_17), r.lines[0]);
          if (sw > TITLE_W) sw = TITLE_W;
          it.line(TITLE_X, y + 9, TITLE_X + sw, y + 9, RED);
        }

        y += r.height;
        drawn++;
      }

      if (n == 0 && !have_agenda) {
        // An empty panel should say whether the day is clear or the feed is
        // simply missing -- those look identical otherwise.
        it.print(W / 2, 190, id(font_title_17), BLACK,
                 TextAlign::TOP_CENTER, "No agenda data");
        it.printf(W / 2, 214, id(font_small_11), BLACK, TextAlign::TOP_CENTER,
                  "api %s", api_is_connected() ? "up" : "down");
        it.print(W / 2, 230, id(font_small_11), BLACK,
                 TextAlign::TOP_CENTER, "check sensor.esp_day_agenda");
      } else if (n == 0) {
        it.print(W / 2, 200, id(font_title_17), BLACK,
                 TextAlign::TOP_CENTER, "Nothing scheduled today");
      } else if (drawn == 0) {
        it.print(W / 2, 200, id(font_title_17), BLACK,
                 TextAlign::TOP_CENTER, "All done for today");
      }

      // Overflow off the bottom still matters -- it is upcoming, not history.
      int hidden_after = n - start - drawn;
      if (hidden_after > 0 && y < Y_MAX + ROW_GAP) {
        it.printf(TIME_X, y - ROW_GAP + 2, id(font_small_11), BLACK,
                  TextAlign::TOP_LEFT, "+%d more later", hidden_after);
      }

      // ══════════════════════════════════════════════════════════════════
      // FOOTER
      // ══════════════════════════════════════════════════════════════════
      it.line(14, 382, W - 14, 382, BLACK);
      if (n > 0) {
        // Count what is still ahead, since that is the actionable number.
        int remaining = 0;
        for (int i = 0; i < n; i++) if (!rows[i].past) remaining++;
        it.printf(14, H - 2, id(font_small_11), BLACK, TextAlign::BOTTOM_LEFT,
                  "%d of %d left%s", remaining, n,
                  start > 0 ? "  (scrolled)" : "");
      }
      it.strftime(W - 14, H - 2, id(font_small_11), BLACK,
                  TextAlign::BOTTOM_RIGHT, "%I:%M %p", now);

font:
  # Day number -- digits only, so an oversized face costs almost no flash.
  - file:
      type: gfonts
      family: "Roboto"
      weight: 300
      italic: false
    id: font_day_54
    size: 54
    glyphs: "0123456789"
  - file:
      type: gfonts
      family: "Roboto"
      weight: 700
      italic: false
    id: font_dow_22
    size: 22
    glyphsets: [GF_Latin_Kernel]
    ignore_missing_glyphs: true
  - file:
      type: gfonts
      family: "Roboto"
      weight: 400
      italic: false
    id: font_title_17
    size: 17
    glyphsets: [GF_Latin_Kernel]
    ignore_missing_glyphs: true
  - file:
      type: gfonts
      family: "Roboto"
      weight: 400
      italic: false
    id: font_sub_15
    size: 15
    glyphsets: [GF_Latin_Kernel]
    ignore_missing_glyphs: true
  - file:
      type: gfonts
      family: "Roboto"
      weight: 700
      italic: false
    id: font_time_14
    size: 14
    glyphsets: [GF_Latin_Kernel]
    ignore_missing_glyphs: true
  - file:
      type: gfonts
      family: "Roboto"
      weight: 400
      italic: false
    id: font_small_11
    size: 11
    glyphsets: [GF_Latin_Kernel]
    ignore_missing_glyphs: true

script:
  # Single self-rescheduling loop. mode: restart means an on_value redraw
  # cancels the pending timer and starts a fresh interval, so a burst of
  # sensor updates can never queue up back-to-back 17-second refreshes.
  - id: refresh_loop
    mode: restart
    then:
      # Short wait: SNTP usually lands in a few seconds. Falling through on
      # timeout is intentional -- drawing the diagnostic screen beats a blank
      # panel, and the retry below is what actually recovers.
      - wait_until:
          condition:
            lambda: 'return id(sys_time).now().is_valid();'
          timeout: 45s
      - if:
          condition:
            lambda: 'return id(initial_sync_pending) && api_is_connected();'
          then:
            - logger.log: "Waiting 5s for initial agenda sensor update..."
            - delay: 5s
            - lambda: 'id(initial_sync_pending) = false;'
      - lambda: |-
          id(data_ready) = id(sys_time).now().is_valid() &&
                           id(agenda_json).has_state();
      # Redraw when there is real data, or to put the diagnostic screen up the
      # first time -- but never to re-paint an unchanged "waiting" screen.
      - if:
          condition:
            lambda: 'return id(data_ready) || !id(degraded_drawn);'
          then:
            - component.update: epaper_display
            - lambda: 'id(degraded_drawn) = !id(data_ready);'
      # Healthy: the normal interval. Degraded: back off 60s -> 120 -> 240 ->
      # 480 -> capped at the normal interval, so a long HA outage costs a
      # handful of refreshes instead of one per minute forever. agenda_json's
      # on_value restarts this script, so recovery is immediate regardless.
      - delay: !lambda |-
          if (id(data_ready)) {
            id(degraded_attempts) = 0;
            return (uint32_t) id(refresh_interval_s) * 1000;
          }
          int a = id(degraded_attempts);
          if (a < 4) id(degraded_attempts) = a + 1;
          uint32_t secs = (uint32_t) 60 << a;
          if (secs > (uint32_t) id(refresh_interval_s))
            secs = (uint32_t) id(refresh_interval_s);
          return secs * 1000;
      - script.execute: refresh_loop
