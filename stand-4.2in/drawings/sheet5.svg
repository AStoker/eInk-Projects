="0.60"/><text class="vlabel" x="67.95" y="6.00" text-anchor="middle" font-size="3.0">BACK COVER  &#183;  inner face</text><line class="ext" x1="22.00" y1="66.50" x2="8.80" y2="66.50"/><line class="ext" x1="22.00" y1="124.50" x2="8.80" y2="124.50"/><line class="dim" x1="10.00" y1="66.50" x2="10.00" y2="124.50"/><path class="arrow" d="M10.00,66.50 L10.51,68.10 L9.49,68.10 Z"/><path class="arrow" d="M10.00,124.50 L9.49,122.90 L10.51,122.90 Z"/><text class="dimtxt" x="8.70" y="95.50" text-anchor="middle" font-size="3.0" transform="rotate(-90 8.70 95.50)">58</text><line class="ext" x1="22.00" y1="124.50" x2="22.00" y2="140.70"/><line class="ext" x1="113.90" y1="124.50" x2="113.90" y2="140.70"/><line class="dim" x1="22.00" y1="139.50" x2="113.90" y2="139.50"/><path class="arrow" d="M22.00,139.50 L23.60,138.99 L23.60,140.01 Z"/><path class="arrow" d="M113.90,139.50 L112.30,140.01 L112.30,138.99 Z"/><text class="dimtxt" x="67.95" y="138.20" text-anchor="middle" font-size="3.0">91.9</text><line class="ext" x1="90.10" y1="41.50" x2="90.10" y2="133.70"/><line class="ext" x1="113.90" y1="41.50" x2="113.90" y2="133.70"/><line class="dim" x1="90.10" y1="132.50" x2="113.90" y2="132.50"/><path class="arrow" d="M90.10,132.50 L91.70,131.99 L91.70,133.01 Z"/><path class="arrow" d="M113.90,132.50 L112.30,133.01 L112.30,131.99 Z"/><text class="dimtxt" x="102.00" y="131.20" text-anchor="middle" font-size="3.0">23.8</text><line class="ext" x1="90.10" y1="41.50" x2="122.10" y2="41.50"/><line class="ext" x1="90.10" y1="124.50" x2="122.10" y2="124.50"/><line class="dim" x1="120.90" y1="41.50" x2="120.90" y2="124.50"/><path class="arrow" d="M120.90,41.50 L121.41,43.10 L120.39,43.10 Z"/><path class="arrow" d="M120.90,124.50 L120.39,122.90 L121.41,122.90 Z"/><text class="dimtxt" x="119.60" y="83.00" text-anchor="middle" font-size="3.0" transform="rotate(-90 119.60 83.00)">83</text><line class="dim" x1="76.95" y1="66.50" x2="86.95" y2="58.50"/><path class="arrow" d="M76.95,66.50 L77.88,65.10 L78.52,65.90 Z"/><circle class="balloon" cx="86.95" cy="58.50" r="2.80"/><text class="baltxt" x="86.95" y="59.65" text-anchor="middle" font-size="3.1">1</text><line class="dim" x1="78.45" y1="121.60" x2="92.45" y2="118.60"/><path class="arrow" d="M78.45,121.60 L79.91,120.76 L80.12,121.77 Z"/><circle class="balloon" cx="92.45" cy="118.60" r="2.80"/><text class="baltxt" x="92.45" y="119.75" text-anchor="middle" font-size="3.1">8</text><line class="dim" x1="90.10" y1="31.85" x2="102.10" y2="47.50"/><path class="arrow" d="M90.10,31.85 L91.48,32.81 L90.67,33.43 Z"/><circle class="balloon" cx="102.10" cy="47.50" r="2.80"/><text class="baltxt" x="102.10" y="48.65" text-anchor="middle" font-size="3.1">2</text><line class="dim" x1="54.50" y1="108.00" x2="67.50" y2="102.00"/><path class="arrow" d="M54.50,108.00 L55.74,106.86 L56.17,107.79 Z"/><circle class="balloon" cx="67.50" cy="102.00" r="2.80"/><text class="baltxt" x="67.50" y="103.15" text-anchor="middle" font-size="3.1">3</text><line class="dim" x1="62.95" y1="30.10" x2="49.95" y2="23.50"/><path class="arrow" d="M62.95,30.10 L61.29,29.83 L61.76,28.92 Z"/><circle class="balloon" cx="49.95" cy="23.50" r="2.80"/><text class="baltxt" x="49.95" y="24.65" text-anchor="middle" font-size="3.1">4</text><line class="dim" x1="74.30" y1="56.45" x2="65.30" y2="48.45"/><path class="arrow" d="M74.30,56.45 L72.76,55.77 L73.44,55.00 Z"/><circle class="balloon" cx="65.30" cy="48.45" r="2.80"/><text class="baltxt" x="65.30" y="49.60" text-anchor="middle" font-size="3.1">5</text><line class="dim" x1="108.40" y1="119.00" x2="94.40" y2="113.00"/><path class="arrow" d="M108.40,119.00 L106.73,118.84 L107.13,117.90 Z"/><circle class="balloon" cx="94.40" cy="113.00" r="2.80"/><text class="baltxt" x="94.40" y="114.15" text-anchor="middle" font-size="3.1">6</text><text class="vlabel" x="150.00" y="22.00" text-anchor="start" font-size="3.2">NOTES</text><circle class="balloon" cx="152.80" cy="27.50" r="2.80"/><text class="baltxt" x="152.80" y="28.65" text-anchor="middle" font-size="3.1">1</text><text class="note" x="159.00" y="28.50" text-anchor="start" font-size="2.7">stand recess in the BACK face - shown hidden</text><text class="note" x="159.00" y="32.20" text-anchor="start" font-size="2.7">because it does not break through: 18 wide x 4.5</text><text class="note" x="159.00" y="35.90" text-anchor="start" font-size="2.7">deep, stepping to 1.4 below z 11.3 where solid</text><text class="note" x="159.00" y="39.60" text-anchor="start" font-size="2.7">frame is behind it. The two pin sockets are on</text><text class="note" x="159.00" y="43.30" text-anchor="start" font-size="2.7">EARS inside it, not bored through its walls, so</text><text class="note" x="159.00" y="47.00" text-anchor="start" font-size="2.7">nothing breaks the back face - see sheet 6</text><circle class="balloon" cx="152.80" cy="52.50" r="2.80"/><text class="baltxt" x="152.80" y="53.65" text-anchor="middle" font-size="3.1">2</text><text class="note" x="159.00" y="53.50" text-anchor="start" font-size="2.7">four dia 6.5 screw posts under the bq25185</text><text class="note" x="159.00" y="57.20" text-anchor="start" font-size="2.7">charger, at 25 x 19.3 centres, standing 3.8 off</text><text class="note" x="159.00" y="60.90" text-anchor="start" font-size="2.7">the register face. Each is bored dia 2.9 x 5 for</text><text class="note" x="159.00" y="64.60" text-anchor="start" font-size="2.7">an M2 heat-set insert, BLIND - 1.2 of skin left.</text><text class="note" x="159.00" y="68.30" text-anchor="start" font-size="2.7">Centres ASSUMED: measure the breakout</text><circle class="balloon" cx="152.80" cy="73.80" r="2.80"/><text class="baltxt" x="152.80" y="74.95" text-anchor="middle" font-size="3.1">3</text><text class="note" x="159.00" y="74.80" text-anchor="start" font-size="2.7">four carrier mounts: a dia 4 PAD 2.5 tall - the</text><text class="note" x="159.00" y="78.50" text-anchor="start" font-size="2.7">air the header solder joints under the board need</text><text class="note" x="159.00" y="82.20" text-anchor="start" font-size="2.7">- carrying a dia 1.85 PEG that drops through the</text><text class="note" x="159.00" y="85.90" text-anchor="start" font-size="2.7">board's hole and locates it. Nothing printed</text><text class="note" x="159.00" y="89.60" text-anchor="start" font-size="2.7">touches the driver board</text><circle class="balloon" cx="152.80" cy="95.10" r="2.80"/><text class="baltxt" x="152.80" y="96.25" text-anchor="middle" font-size="3.1">4</text><text class="note" x="159.00" y="96.10" text-anchor="start" font-size="2.7">USB-C charge port, opening 14.3 x 4.8 through the</text><text class="note" x="159.00" y="99.80" text-anchor="start" font-size="2.7">skin at x -5 z 92 - a snap-in pigtail, so nothing</text><text class="note" x="159.00" y="103.50" text-anchor="start" font-size="2.7">is printed around it. Placed here to keep it out</text><text class="note" x="159.00" y="107.20" text-anchor="start" font-size="2.7">of a band with any other opening: nearest is 26.1</text><text class="note" x="159.00" y="110.90" text-anchor="start" font-size="2.7">away</text><circle class="balloon" cx="152.80" cy="116.40" r="2.80"/><text class="baltxt" x="152.80" y="117.55" text-anchor="middle" font-size="3.1">5</text><text class="note" x="159.00" y="117.40" text-anchor="start" font-size="2.7">cell platform at depth 18.7, level with the back</text><text class="note" x="159.00" y="121.10" text-anchor="start" font-size="2.7">of the recess floor so the cell does not straddle</text><text class="note" x="159.00" y="124.80" text-anchor="start" font-size="2.7">the step, with a 1 fence</text><circle class="balloon" cx="152.80" cy="130.30" r="2.80"/><text class="baltxt" x="152.80" y="131.45" text-anchor="middle" font-size="3.1">6</text><text class="note" x="159.00" y="131.30" text-anchor="start" font-size="2.7">the four corner screw holes, counterbored</text><circle class="balloon" cx="152.80" cy="136.80" r="2.80"/><text class="baltxt" x="152.80" y="137.95" text-anchor="middle" font-size="3.1">8</text><text class="note" x="159.00" y="137.80" text-anchor="start" font-size="2.7">the register extension, 21 wide, FLOORS the</text><text class="note" x="159.00" y="141.50" text-anchor="start" font-size="2.7">shallow end of the recess. It plugs a relief in</text><text class="note" x="159.00" y="145.20" text-anchor="start" font-size="2.7">the frame 0.15 larger, so a gap runs all round it</text><text class="note" x="159.00" y="148.90" text-anchor="start" font-size="2.7">- which is why it STOPS at z 1.9, clear of the 0.6</text><text class="note" x="159.00" y="152.60" text-anchor="start" font-size="2.7">the rear chamfer takes off the back face. Lower,</text><text class="note" x="159.00" y="156.30" text-anchor="start" font-size="2.7">and that gap opens through the chamfer into the</text><text class="note" x="159.00" y="160.00" text-anchor="start" font-size="2.7">frame's end wall</text><text class="note" x="166.00" y="164.60" text-anchor="start" font-size="2.35">STLs export flat-face-down, as drawn (print_mirror = false)</text><rect class="tbframe" x="166.00" y="167.00" width="96.00" height="18.00" rx="0.00"/><line class="tbrule" x1="166.00" y1="176.00" x2="262.00" y2="176.00"/><line class="tbrule" x1="218.80" y1="176.00" x2="218.80" y2="185.00"/><line class="tbrule" x1="240.88" y1="176.00" x2="240.88" y2="185.00"/><text class="tbname" x="168.00" y="173.12" text-anchor="start" font-size="3.6">BACK COVER</text><text class="tbmeta" x="168.00" y="182.30" text-anchor="start" font-size="2.4">UNITS mm &#183; SCALE 1:1</text><text class="tbmeta" x="221.20" y="182.30" text-anchor="start" font-size="2.4">SHEET 5/8</text><text class="tbmeta" x="242.80" y="182.30" text-anchor="start" font-size="2.4">REV E</text></svg>