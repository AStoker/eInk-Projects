" y="62.77" text-anchor="middle" font-size="3.1">3</text><line class="dim" x1="89.95" y1="108.00" x2="78.95" y2="104.00"/><path class="arrow" d="M89.95,108.00 L88.27,107.93 L88.62,106.97 Z"/><circle class="balloon" cx="78.95" cy="104.00" r="2.80"/><text class="baltxt" x="78.95" y="105.15" text-anchor="middle" font-size="3.1">4</text><line class="dim" x1="74.30" y1="54.70" x2="65.30" y2="46.70"/><path class="arrow" d="M74.30,54.70 L72.76,54.02 L73.44,53.25 Z"/><circle class="balloon" cx="65.30" cy="46.70" r="2.80"/><text class="baltxt" x="65.30" y="47.85" text-anchor="middle" font-size="3.1">5</text><line class="dim" x1="108.40" y1="119.00" x2="94.40" y2="113.00"/><path class="arrow" d="M108.40,119.00 L106.73,118.84 L107.13,117.90 Z"/><circle class="balloon" cx="94.40" cy="113.00" r="2.80"/><text class="baltxt" x="94.40" y="114.15" text-anchor="middle" font-size="3.1">6</text><text class="vlabel" x="150.00" y="22.00" text-anchor="start" font-size="3.2">NOTES</text><circle class="balloon" cx="152.80" cy="27.50" r="2.80"/><text class="baltxt" x="152.80" y="28.65" text-anchor="middle" font-size="3.1">1</text><text class="note" x="159.00" y="28.50" text-anchor="start" font-size="2.7">pocket bore dia 54.7 x 4.15 deep. Bayonet</text><text class="note" x="159.00" y="32.20" text-anchor="start" font-size="2.7">groove dia 57.3 with three 34 deg entry gaps</text><text class="note" x="159.00" y="35.90" text-anchor="start" font-size="2.7">at 45 / 165 / 285 deg</text><circle class="balloon" cx="152.80" cy="41.40" r="2.80"/><text class="baltxt" x="152.80" y="42.55" text-anchor="middle" font-size="3.1">2</text><text class="note" x="159.00" y="42.40" text-anchor="start" font-size="2.7">four standoff pads under the bq25185</text><text class="note" x="159.00" y="46.10" text-anchor="start" font-size="2.7">charger, 32 x 26.3. Foam tape or a strap</text><text class="note" x="159.00" y="49.80" text-anchor="start" font-size="2.7">holds it - no screw posts, its hole spacing</text><text class="note" x="159.00" y="53.50" text-anchor="start" font-size="2.7">is not a measured number</text><circle class="balloon" cx="152.80" cy="59.00" r="2.80"/><text class="baltxt" x="152.80" y="60.15" text-anchor="middle" font-size="3.1">3</text><text class="note" x="159.00" y="60.00" text-anchor="start" font-size="2.7">driver-board rails - the board slides down</text><text class="note" x="159.00" y="63.70" text-anchor="start" font-size="2.7">from the top, stop at the bottom</text><circle class="balloon" cx="152.80" cy="69.20" r="2.80"/><text class="baltxt" x="152.80" y="70.35" text-anchor="middle" font-size="3.1">4</text><text class="note" x="159.00" y="70.20" text-anchor="start" font-size="2.7">USB-C breakout rails; the port opening is</text><text class="note" x="159.00" y="73.90" text-anchor="start" font-size="2.7">through the skin below them</text><circle class="balloon" cx="152.80" cy="79.40" r="2.80"/><text class="baltxt" x="152.80" y="80.55" text-anchor="middle" font-size="3.1">5</text><text class="note" x="159.00" y="80.40" text-anchor="start" font-size="2.7">cell platform, level with the puck face so</text><text class="note" x="159.00" y="84.10" text-anchor="start" font-size="2.7">the cell does not straddle the step, with a</text><text class="note" x="159.00" y="87.80" text-anchor="start" font-size="2.7">1 fence</text><circle class="balloon" cx="152.80" cy="93.30" r="2.80"/><text class="baltxt" x="152.80" y="94.45" text-anchor="middle" font-size="3.1">7</text><text class="note" x="159.00" y="94.30" text-anchor="start" font-size="2.7">not fitted</text><circle class="balloon" cx="152.80" cy="99.80" r="2.80"/><text class="baltxt" x="152.80" y="100.95" text-anchor="middle" font-size="3.1">6</text><text class="note" x="159.00" y="100.80" text-anchor="start" font-size="2.7">the four corner screw holes, counterbored</text><text class="note" x="166.00" y="164.60" text-anchor="start" font-size="2.35">STLs export flat-face-down and MIRRORED IN X (print_mirror = true)</text><rect class="tbframe" x="166.00" y="167.00" width="96.00" height="18.00" rx="0.00"/><line class="tbrule" x1="166.00" y1="176.00" x2="262.00" y2="176.00"/><line class="tbrule" x1="218.80" y1="176.00" x2="218.80" y2="185.00"/><line class="tbrule" x1="240.88" y1="176.00" x2="240.88" y2="185.00"/><text class="tbname" x="168.00" y="173.12" text-anchor="start" font-size="3.6">BACK COVER</text><text class="tbmeta" x="168.00" y="182.30" text-anchor="start" font-size="2.4">UNITS mm &#183; SCALE 1:1</text><text class="tbmeta" x="221.20" y="182.30" text-anchor="start" font-size="2.4">SHEET 5/8</text><text class="tbmeta" x="242.80" y="182.30" text-anchor="start" font-size="2.4">REV E</text></svg>