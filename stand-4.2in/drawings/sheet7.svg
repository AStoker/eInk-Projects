art" font-size="3.4">20.5 deg</text><line class="ext" x1="46.00" y1="140.00" x2="46.00" y2="154.20"/><line class="ext" x1="79.49" y1="140.00" x2="79.49" y2="154.20"/><line class="dim" x1="46.00" y1="153.00" x2="79.49" y2="153.00"/><path class="arrow" d="M46.00,153.00 L47.60,152.49 L47.60,153.51 Z"/><path class="arrow" d="M79.49,153.00 L77.89,153.51 L77.89,152.49 Z"/><text class="dimtxt" x="62.75" y="151.70" text-anchor="middle" font-size="3.0">31.9</text><line class="ext" x1="46.00" y1="140.00" x2="46.00" y2="164.20"/><line class="ext" x1="54.55" y1="140.00" x2="54.55" y2="164.20"/><line class="dim" x1="46.00" y1="163.00" x2="54.55" y2="163.00"/><line class="dim" x1="42.00" y1="163.00" x2="46.00" y2="163.00"/><line class="dim" x1="54.55" y1="163.00" x2="58.55" y2="163.00"/><path class="arrow" d="M46.00,163.00 L44.40,163.51 L44.40,162.49 Z"/><path class="arrow" d="M54.55,163.00 L56.15,162.49 L56.15,163.51 Z"/><text class="dimtxt" x="50.28" y="161.40" text-anchor="middle" font-size="3.0">8.15</text><text class="note" x="49.00" y="171.00" text-anchor="start" font-size="2.6">footprint / CoM offset, both behind the contact edge</text><text class="vlabel" x="66.00" y="16.00" text-anchor="start" font-size="3.2">SIDE ELEVATION  &#183;  leg deployed</text><text class="vlabel" x="168.00" y="22.00" text-anchor="start" font-size="3.2">NOTES</text><circle class="balloon" cx="170.80" cy="27.50" r="2.80"/><text class="baltxt" x="170.80" y="28.65" text-anchor="middle" font-size="3.1">1</text><text class="note" x="177.00" y="28.50" text-anchor="start" font-size="2.7">hinge pin, 16 from the hub centre</text><circle class="balloon" cx="170.80" cy="34.00" r="2.80"/><text class="baltxt" x="170.80" y="35.15" text-anchor="middle" font-size="3.1">2</text><text class="note" x="177.00" y="35.00" text-anchor="start" font-size="2.7">disc hub, 45.95 above the bottom edge</text><circle class="balloon" cx="170.80" cy="40.50" r="2.80"/><text class="baltxt" x="170.80" y="41.65" text-anchor="middle" font-size="3.1">3</text><text class="note" x="177.00" y="41.50" text-anchor="start" font-size="2.7">foot. Leg 35.4 long, hard stop at 58 deg</text><text class="note" x="177.00" y="45.20" text-anchor="start" font-size="2.7">from straight down</text><circle class="balloon" cx="170.80" cy="50.70" r="2.80"/><text class="baltxt" x="170.80" y="51.85" text-anchor="middle" font-size="3.1">4</text><text class="note" x="177.00" y="51.70" text-anchor="start" font-size="2.7">contact edge - the rear edge of the flat</text><text class="note" x="177.00" y="55.40" text-anchor="start" font-size="2.7">bottom, brought forward 2 by the back</text><text class="note" x="177.00" y="59.10" text-anchor="start" font-size="2.7">chamfer. This, not the front edge, is what</text><text class="note" x="177.00" y="62.80" text-anchor="start" font-size="2.7">the frame leans on</text><circle class="balloon" cx="170.80" cy="68.30" r="2.80"/><text class="baltxt" x="170.80" y="69.45" text-anchor="middle" font-size="3.1">5</text><text class="note" x="177.00" y="69.30" text-anchor="start" font-size="2.7">estimated centre of mass. It must sit</text><text class="note" x="177.00" y="73.00" text-anchor="start" font-size="2.7">behind the contact edge or the frame</text><text class="note" x="177.00" y="76.70" text-anchor="start" font-size="2.7">simply falls flat onto its face</text><text class="vlabel" x="168.00" y="108.00" text-anchor="start" font-size="3.2">WHY THE HUB SITS LOW</text><text class="note" x="168.00" y="115.00" text-anchor="start" font-size="2.7">The frame is 91.9 x 110.5. A hub on the frame's</text><text class="note" x="168.00" y="119.00" text-anchor="start" font-size="2.7">centre would sit 55.25 above the bottom edge in</text><text class="note" x="168.00" y="123.00" text-anchor="start" font-size="2.7">portrait but only 45.95 in landscape, so the leg</text><text class="note" x="168.00" y="127.00" text-anchor="start" font-size="2.7">over-reaches and landscape stands about 9 deg</text><text class="note" x="168.00" y="131.00" text-anchor="start" font-size="2.7">more upright - close to tipping forward.</text><text class="note" x="168.00" y="135.00" text-anchor="start" font-size="2.7"></text><text class="note" x="168.00" y="139.00" text-anchor="start" font-size="2.7">Putting the hub at z = 45.95 = W/2 makes the</text><text class="note" x="168.00" y="143.00" text-anchor="start" font-size="2.7">pivot the same height above whichever edge is</text><text class="note" x="168.00" y="147.00" text-anchor="start" font-size="2.7">down. Both orientations then give:</text><text class="val" x="168.00" y="156.00" text-anchor="start" font-size="4.2">lean 20.5 deg   &#183;   footprint 31.9</text><text class="note" x="166.00" y="164.60" text-anchor="start" font-size="2.35">STLs export flat-face-down, as drawn (print_mirror = false)</text><rect class="tbframe" x="166.00" y="167.00" width="96.00" height="18.00" rx="0.00"/><line class="tbrule" x1="166.00" y1="176.00" x2="262.00" y2="176.00"/><line class="tbrule" x1="218.80" y1="176.00" x2="218.80" y2="185.00"/><line class="tbrule" x1="240.88" y1="176.00" x2="240.88" y2="185.00"/><text class="tbname" x="168.00" y="173.12" text-anchor="start" font-size="3.6">STAND KINEMATICS</text><text class="tbmeta" x="168.00" y="182.30" text-anchor="start" font-size="2.4">UNITS mm &#183; SCALE 1:1.05</text><text class="tbmeta" x="221.20" y="182.30" text-anchor="start" font-size="2.4">SHEET 7/8</text><text class="tbmeta" x="242.80" y="182.30" text-anchor="start" font-size="2.4">REV E</text></svg>