"143.40"/><path class="part" d="M23.66,130.83 L67.71,23.49 L91.99,33.46 L47.94,140.80 Z"/><line class="inkline" x1="27.25" y1="122.09" x2="64.12" y2="32.24"/><line class="hid" x1="69.12" y1="83.66" x2="47.20" y2="137.09"/><line class="leg" x1="69.12" y1="83.66" x2="81.80" y2="140.00"/><circle class="cut" cx="69.12" cy="83.66" r="1.50"/><circle class="com" cx="56.37" cy="81.55" r="1.80"/><line class="cl" x1="56.37" y1="81.55" x2="56.37" y2="140.00"/><line class="dim" x1="69.12" y1="83.66" x2="80.12" y2="74.66"/><path class="arrow" d="M69.12,83.66 L70.04,82.25 L70.68,83.04 Z"/><circle class="balloon" cx="80.12" cy="74.66" r="2.80"/><text class="baltxt" x="80.12" y="75.81" text-anchor="middle" font-size="3.1">1</text><line class="dim" x1="58.16" y1="110.37" x2="82.12" y2="92.66"/><path class="arrow" d="M58.16,110.37 L59.14,109.01 L59.75,109.83 Z"/><circle class="balloon" cx="82.12" cy="92.66" r="2.80"/><text class="baltxt" x="82.12" y="93.81" text-anchor="middle" font-size="3.1">2</text><line class="dim" x1="79.80" y1="138.00" x2="83.80" y2="129.00"/><path class="arrow" d="M79.80,138.00 L79.99,136.33 L80.92,136.75 Z"/><circle class="balloon" cx="83.80" cy="129.00" r="2.80"/><text class="baltxt" x="83.80" y="130.15" text-anchor="middle" font-size="3.1">3</text><line class="dim" x1="46.00" y1="138.50" x2="34.00" y2="129.00"/><path class="arrow" d="M46.00,138.50 L44.43,137.91 L45.06,137.11 Z"/><circle class="balloon" cx="34.00" cy="129.00" r="2.80"/><text class="baltxt" x="34.00" y="130.15" text-anchor="middle" font-size="3.1">4</text><line class="dim" x1="56.37" y1="81.55" x2="41.37" y2="90.55"/><path class="arrow" d="M56.37,81.55 L55.26,82.81 L54.73,81.93 Z"/><circle class="balloon" cx="41.37" cy="90.55" r="2.80"/><text class="baltxt" x="41.37" y="91.70" text-anchor="middle" font-size="3.1">5</text><line class="cl" x1="46.00" y1="140.00" x2="46.00" y2="68.00"/><path class="dim" d="M46.00,76.00 A64,64 0 0 1 70.30,80.79"/><text class="dimtxt" x="61.54" y="69.32" text-anchor="start" font-size="3.4">22.3 deg</text><line class="ext" x1="46.00" y1="140.00" x2="46.00" y2="154.20"/><line class="ext" x1="81.80" y1="140.00" x2="81.80" y2="154.20"/><line class="dim" x1="46.00" y1="153.00" x2="81.80" y2="153.00"/><path class="arrow" d="M46.00,153.00 L47.60,152.49 L47.60,153.51 Z"/><path class="arrow" d="M81.80,153.00 L80.20,153.51 L80.20,152.49 Z"/><text class="dimtxt" x="63.90" y="151.70" text-anchor="middle" font-size="3.0">34.1</text><line class="ext" x1="46.00" y1="140.00" x2="46.00" y2="164.20"/><line class="ext" x1="56.37" y1="140.00" x2="56.37" y2="164.20"/><line class="dim" x1="46.00" y1="163.00" x2="56.37" y2="163.00"/><path class="arrow" d="M46.00,163.00 L47.60,162.49 L47.60,163.51 Z"/><path class="arrow" d="M56.37,163.00 L54.77,163.51 L54.77,162.49 Z"/><text class="dimtxt" x="51.18" y="161.70" text-anchor="middle" font-size="3.0">9.88</text><text class="note" x="49.00" y="171.00" text-anchor="start" font-size="2.6">footprint / CoM offset, both behind the contact edge</text><text class="vlabel" x="66.00" y="16.00" text-anchor="start" font-size="3.2">SIDE ELEVATION  &#183;  PORTRAIT  &#183;  leg deployed and folded</text><text class="vlabel" x="168.00" y="22.00" text-anchor="start" font-size="3.2">NOTES</text><circle class="balloon" cx="170.80" cy="27.50" r="2.80"/><text class="baltxt" x="170.80" y="28.65" text-anchor="middle" font-size="3.1">1</text><text class="note" x="177.00" y="28.50" text-anchor="start" font-size="2.7">hinge pin, z 58 and depth 23 - that depth</text><text class="note" x="177.00" y="32.20" text-anchor="start" font-size="2.7">is 2 below the back face, which is what</text><text class="note" x="177.00" y="35.90" text-anchor="start" font-size="2.7">makes the folded leg flush</text><circle class="balloon" cx="170.80" cy="41.40" r="2.80"/><text class="baltxt" x="170.80" y="42.55" text-anchor="middle" font-size="3.1">2</text><text class="note" x="177.00" y="42.40" text-anchor="start" font-size="2.7">the leg folded: it reaches down to z 3,</text><text class="note" x="177.00" y="46.10" text-anchor="start" font-size="2.7">and the back chamfer ends at 2, so nothing</text><text class="note" x="177.00" y="49.80" text-anchor="start" font-size="2.7">overhangs the bottom edge</text><circle class="balloon" cx="170.80" cy="55.30" r="2.80"/><text class="baltxt" x="170.80" y="56.45" text-anchor="middle" font-size="3.1">3</text><text class="note" x="177.00" y="56.30" text-anchor="start" font-size="2.7">foot deployed. Leg 55 long, hard stop at</text><text class="note" x="177.00" y="60.00" text-anchor="start" font-size="2.7">35 deg on the heel's flat - see sheet 6</text><circle class="balloon" cx="170.80" cy="65.50" r="2.80"/><text class="baltxt" x="170.80" y="66.65" text-anchor="middle" font-size="3.1">4</text><text class="note" x="177.00" y="66.50" text-anchor="start" font-size="2.7">contact edge - the rear edge of the flat</text><text class="note" x="177.00" y="70.20" text-anchor="start" font-size="2.7">bottom, brought forward 2 by the back</text><text class="note" x="177.00" y="73.90" text-anchor="start" font-size="2.7">chamfer. This, not the front edge, is what</text><text class="note" x="177.00" y="77.60" text-anchor="start" font-size="2.7">the frame leans on</text><circle class="balloon" cx="170.80" cy="83.10" r="2.80"/><text class="baltxt" x="170.80" y="84.25" text-anchor="middle" font-size="3.1">5</text><text class="note" x="177.00" y="84.10" text-anchor="start" font-size="2.7">estimated centre of mass. It must sit</text><text class="note" x="177.00" y="87.80" text-anchor="start" font-size="2.7">behind the contact edge or the frame</text><text class="note" x="177.00" y="91.50" text-anchor="start" font-size="2.7">simply falls flat onto its face</text><text class="vlabel" x="168.00" y="100.00" text-anchor="start" font-size="3.2">WHAT SETS THE STANCE</text><text class="note" x="168.00" y="107.00" text-anchor="start" font-size="2.7">The leg is a LEVER. At 35 deg the heel on the far</text><text class="note" x="168.00" y="111.00" text-anchor="start" font-size="2.7">side of the pin reaches the recess floor, so the</text><text class="note" x="168.00" y="115.00" text-anchor="start" font-size="2.7">stop is a face in compression rather than the</text><text class="note" x="168.00" y="119.00" text-anchor="start" font-size="2.7">hinge taking a moment.</text><text class="note" x="168.00" y="123.00" text-anchor="start" font-size="2.7"></text><text class="note" x="168.00" y="127.00" text-anchor="start" font-size="2.7">Keeping the swing under 90 deg is what lets the</text><text class="note" x="168.00" y="131.00" text-anchor="start" font-size="2.7">heel land ON the floor plane instead of rotating</text><text class="note" x="168.00" y="135.00" text-anchor="start" font-size="2.7">past it, so dep_ang is bounded above by that and</text><text class="note" x="168.00" y="139.00" text-anchor="start" font-size="2.7">below by the lean the desk needs.</text><text class="note" x="168.00" y="143.00" text-anchor="start" font-size="2.7"></text><text class="note" x="168.00" y="147.00" text-anchor="start" font-size="2.7">dep_ang sets the lean; leg_len the footprint.</text><text class="note" x="168.00" y="151.00" text-anchor="start" font-size="2.7">The two do not interact.</text><text class="val" x="168.00" y="160.00" text-anchor="start" font-size="4.2">lean 22.3 deg   &#183;   footprint 34.1</text><text class="note" x="166.00" y="164.60" text-anchor="start" font-size="2.35">STLs export flat-face-down, as drawn (print_mirror = false)</text><rect class="tbframe" x="166.00" y="167.00" width="96.00" height="18.00" rx="0.00"/><line class="tbrule" x1="166.00" y1="176.00" x2="262.00" y2="176.00"/><line class="tbrule" x1="218.80" y1="176.00" x2="218.80" y2="185.00"/><line class="tbrule" x1="240.88" y1="176.00" x2="240.88" y2="185.00"/><text class="tbname" x="168.00" y="173.12" text-anchor="start" font-size="3.6">STAND KINEMATICS</text><text class="tbmeta" x="168.00" y="182.30" text-anchor="start" font-size="2.4">UNITS mm &#183; SCALE 1:1.05</text><text class="tbmeta" x="221.20" y="182.30" text-anchor="start" font-size="2.4">SHEET 7/8</text><text class="tbmeta" x="242.80" y="182.30" text-anchor="start" font-size="2.4">REV E</text></svg>