# ============================================================================
# eInk Daily Dash
# ============================================================================
# A 4.2" three-colour e-paper panel in a desk frame that shows one of three
# things: today's agenda drawn on-device, a photo, or a generated picture.
#
# Hardware, wiring, power budget and the printed parts: ../stand-4.2in/README.md
# Image pipeline, blob format and the app contracts: ../IMAGE-PIPELINE.md
#
#   SPI:     CLK = GPIO13, MOSI = GPIO14   (non-standard pins)
#   Control: CS  = GPIO15, DC   = GPIO27, RST = GPIO26, BUSY = GPIO25
#   Battery: GPIO35 via a 100k/100k divider  (ADC1 -- ADC2 is dead under WiFi)
#   GPIO4 is NOT free: on this board it gates the panel's supply rail.
#
# ----------------------------------------------------------------------------
# LAYOUT OF THIS CONFIG
# ----------------------------------------------------------------------------
# This file is the device core -- substitutions, connectivity, the clock. Each
# feature is a package under packages/, and every tunable lives in the
# substitutions block below, which is the one place to edit. Cross-package
# wiring is by ESPHome id; each package's header names what it defines and what
# it consumes.
#
# This file is not built directly. Build one of the two entry points:
#   dev.yaml             local development, component from ./components
#   example-device.yaml  what goes in ESPHome Device Builder, everything
#                        pulled from GitHub
#
# ----------------------------------------------------------------------------
# REQUIRED HOME ASSISTANT SETUP
# ----------------------------------------------------------------------------
#   sensor.esp_day_agenda          "entries" attribute, a JSON array of today's
#                                  events -- see packages/agenda.yaml
#   input_boolean.eink_daily_dash_disable_deep_sleep
#                                  holds the board awake for OTA
#   input_select.eink_daily_dash_mode
#                                  Dash / Photos / AI
#
# Without the agenda sensor the panel still shows the date and renders
# "Nothing scheduled today". Without the toggle the board can only be caught in
# its cold-boot window -- see packages/sleep.yaml.
# ============================================================================

substitutions:
  # How long the panel sleeps between wakes -- and therefore its refresh rate.
  sleep_duration: 15min
  # Failsafe cap on a single wake, so a hung script cannot hold the board up
  # and flatten the cell. Must clear the worst-case healthy wake, which is
  # 45 s clock + 30 s api + 20 s agenda + 3 s + a 17 s refresh = ~115 s.
  # deep_sleep.prevent overrides it, which is what makes both hold-awake paths
  # below work.
  max_awake: 240s
  # How long a cold boot stays up before its first sleep, whatever Home
  # Assistant says. This is the bootstrap OTA window -- see COLD BOOT below.
  cold_boot_awake: 120s
  # Consecutive wakes with no API before the panel gives up and draws the dog.
  fail_limit: '2'
  # How long a wake waits for the API before calling it a miss.
  api_wait: 30s
  # Battery sense. Must be ADC1 (GPIO 32-39) -- ADC2 is dead while WiFi is on.
  # GPIO 35 is input-only and leaves 32/33 free for the buttons the frame is
  # cut for. Divider is two 100k, so the pin sees half the cell.
  batt_adc_pin: GPIO35
  batt_divider: '2.0'
  # Home Assistant toggle helper that holds the board awake for flashing.
  ha_disable_deep_sleep: input_boolean.eink_daily_dash_disable_deep_sleep
  # --- image modes -----------------------------------------------------
  # The e-ink app: converts photos and generated images into panel-ready
  # blobs and serves them. Host:port as the ESP32 can reach it -- an app on
  # the HA host is <slug>.local.hass.io, but the panel is not inside that
  # network, so this is normally the HA machine's LAN address and the app's
  # published port. See IMAGE-PIPELINE.md.
  eink_host: "homeassistant.local:8100"
  ha_mode_select: input_select.eink_daily_dash_mode
  # Steps through the photo library. The panel sends it to the app, which adds
  # it to the clock-driven index, so Next/Previous nudge the rotation rather
  # than replacing it.
  ha_photo_offset: input_number.eink_daily_dash_photo_offset
  # The one mode the firmware draws itself. Everything else is a picture and
  # gets passed to the app verbatim.
  dash_option: "Dash"


# ---------------------------------------------------------------------
# FEATURE PACKAGES -- each is a self-contained slice. See the header
# comment in each file for the ids it defines and consumes.
# ---------------------------------------------------------------------
packages:
  display: !include packages/display.yaml
  agenda: !include packages/agenda.yaml
  image: !include packages/image.yaml
  sleep: !include packages/sleep.yaml
  battery: !include packages/battery.yaml

esphome:
  name: eink-daily-dash
  friendly_name: "eInk Daily Dash"
  min_version: 2024.11.0
  on_boot:
    priority: -100
    then:
      - script.execute: wake_cycle

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret eink_daily_dash__api_encryption

ota:
  - platform: esphome
    password: !secret eink_daily_dash__ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "eInk-Daily-Dash"
    password: !secret ap_password

captive_portal:

# Declaring json: sets USE_JSON, which pulls in <ArduinoJson.h> for the
# deserializeJson() call in the display lambda.

json:

# Pulls in the blob fetcher's transport. buffer_size_rx stays small on purpose:
# components/eink_blob streams a row at a time and never wants the response
# held in memory.
http_request:
  timeout: 20s
  verify_ssl: false
  buffer_size_rx: 2048

# NOTE: components/eink_blob is NOT declared here. ESPHome resolves a
# `type: local` component path against the directory of the TOP-LEVEL config,
# not against the package that asked for it, so a package cannot point at a
# component sitting next to itself. The entry point declares it instead --
# dev.yaml for a local build, example-device.yaml for a pull from GitHub.
external_components:
  - source:
      type: git
      url: https://github.com/astoker/esphome-waveshare-4in2b-v2
      ref: main
    components: [waveshare_4in2b_v2]
    refresh: 0s

spi:
  clk_pin: GPIO13
  mosi_pin: GPIO14

# ----------------------------------------------------------------------------
# CLOCK
# ----------------------------------------------------------------------------
# SNTP first, deliberately. The `homeassistant` platform pulls time over the
# API, so before this node is adopted in HA it has no clock at all and the
# panel can only render "Waiting for clock..." -- it cannot even show today's
# date. SNTP needs nothing but Wi-Fi, so the date block always works and only
# the agenda depends on HA.
#
# Both platforms write the same system clock, and RealTimeClock::now() reads
# that clock, so `sys_time` reports valid time from whichever source lands
# first and HA silently keeps it trued up afterwards.
#
# The timezone is explicit because SNTP has no HA to learn it from; ESPHome
# would otherwise bake in whatever timezone the *build machine* had. It must
# match HA's, or the "happening now" highlighting drifts -- the m/n fields are
# minutes past HA-local midnight.

time:
  - platform: sntp
    id: sys_time
    timezone: America/New_York
    servers:
      - 0.pool.ntp.org
      - 1.pool.ntp.org
      - 2.pool.ntp.org
    on_time:
      # Only reachable while deep sleep is held off; a sleeping board wakes on
      # its own timer and picks the new date up then.
      - seconds: 30
        minutes: 0
        hours: 0
        then:
          - script.execute: wake_cycle
  - platform: homeassistant
    id: ha_time
