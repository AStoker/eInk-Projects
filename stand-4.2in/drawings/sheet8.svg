-anchor="start" font-size="2.6">LOAD</text><circle class="cut" cx="170.00" cy="48.00" r="0.80"/><text class="note" x="168.00" y="49.00" text-anchor="end" font-size="2.6">5V</text><circle class="cut" cx="138.00" cy="70.00" r="0.80"/><text class="note" x="140.00" y="71.00" text-anchor="start" font-size="2.6">GND</text><circle class="cut" cx="170.00" cy="60.00" r="0.80"/><text class="note" x="168.00" y="61.00" text-anchor="end" font-size="2.6">GND</text><circle class="cut" cx="170.00" cy="72.00" r="0.80"/><text class="note" x="168.00" y="73.00" text-anchor="end" font-size="2.6">GPIO 32-39</text><circle class="cut" cx="80.00" cy="80.00" r="0.80"/><text class="note" x="78.00" y="81.00" text-anchor="end" font-size="2.6">TH</text><circle class="cut" cx="98.00" cy="108.00" r="0.80"/><text class="note" x="100.00" y="105.40" text-anchor="start" font-size="2.6">+ red</text><circle class="cut" cx="114.00" cy="134.00" r="0.80"/><text class="note" x="116.40" y="135.00" text-anchor="start" font-size="2.6">- black</text><circle class="cut" cx="126.00" cy="108.00" r="0.80"/><text class="note" x="128.40" y="105.40" text-anchor="start" font-size="2.6">NTC</text><path class="wire" d="M54.00,48.00 L80.00,48.00"/><text class="dimtxt" x="67.00" y="45.60" text-anchor="middle" font-size="2.7">5 V</text><path class="wire" d="M54.00,58.00 L80.00,58.00"/><path class="wire" d="M80.00,70.00 L66.00,70.00 L66.00,98.00 L98.00,98.00 L98.00,108.00"/><path class="wire ntc" d="M126,108 L126,94 L60,94 L60,80 L80,80"/><text class="dimtxt" x="93.00" y="92.40" text-anchor="middle" font-size="2.6">yellow  &#183;  10k NTC</text><path class="wire" d="M138.00,48.00 L170.00,48.00"/><text class="dimtxt" x="152.00" y="45.60" text-anchor="middle" font-size="2.7">3.0-4.5 V</text><path class="wire" d="M138.00,70.00 L150.00,70.00 L150.00,60.00 L170.00,60.00"/><rect class="res" x="159.00" y="88.00" width="6.00" height="11.00" rx="0.00"/><text class="note" x="168.00" y="94.60" text-anchor="start" font-size="2.6">100k</text><rect class="res" x="159.00" y="107.00" width="6.00" height="11.00" rx="0.00"/><text class="note" x="168.00" y="113.60" text-anchor="start" font-size="2.6">100k</text><path class="wire" d="M162.00,48.00 L162.00,88.00"/><path class="wire" d="M162.00,99.00 L162.00,107.00"/><path class="wire" d="M162.00,103.00 L166.00,103.00 L166.00,72.00 L170.00,72.00"/><path class="wire" d="M162.00,118.00 L162.00,142.00"/><path class="wire" d="M80.00,58.00 L56.00,58.00 L56.00,142.00 L162.00,142.00"/><path class="wire" d="M114.00,134.00 L114.00,142.00"/><line class="wire" x1="108.00" y1="142.00" x2="120.00" y2="142.00"/><line class="edge" x1="110.50" y1="145.00" x2="117.50" y2="145.00"/><line class="edge" x1="113.00" y1="148.00" x2="115.00" y2="148.00"/><text class="note" x="114.00" y="153.00" text-anchor="middle" font-size="2.6">GND</text><line class="dim" x1="67.00" y1="48.00" x2="40.00" y2="24.00"/><path class="arrow" d="M67.00,48.00 L65.46,47.32 L66.14,46.55 Z"/><circle class="balloon" cx="40.00" cy="24.00" r="2.80"/><text class="baltxt" x="40.00" y="25.15" text-anchor="middle" font-size="3.1">1</text><line class="dim" x1="109.00" y1="30.00" x2="109.00" y2="18.00"/><path class="arrow" d="M109.00,30.00 L108.49,28.40 L109.51,28.40 Z"/><circle class="balloon" cx="109.00" cy="18.00" r="2.80"/><text class="baltxt" x="109.00" y="19.15" text-anchor="middle" font-size="3.1">2</text><line class="dim" x1="152.00" y1="48.00" x2="152.00" y2="22.00"/><path class="arrow" d="M152.00,48.00 L151.49,46.40 L152.51,46.40 Z"/><circle class="balloon" cx="152.00" cy="22.00" r="2.80"/><text class="baltxt" x="152.00" y="23.15" text-anchor="middle" font-size="3.1">3</text><line class="dim" x1="162.00" y1="103.00" x2="144.00" y2="103.00"/><path class="arrow" d="M162.00,103.00 L160.40,103.51 L160.40,102.49 Z"/><circle class="balloon" cx="144.00" cy="103.00" r="2.80"/><text class="baltxt" x="144.00" y="104.15" text-anchor="middle" font-size="3.1">4</text><line class="dim" x1="80.00" y1="80.00" x2="40.00" y2="80.00"/><path class="arrow" d="M80.00,80.00 L78.40,80.51 L78.40,79.49 Z"/><circle class="balloon" cx="40.00" cy="80.00" r="2.80"/><text class="baltxt" x="40.00" y="81.15" text-anchor="middle" font-size="3.1">6</text><line class="dim" x1="170.00" y1="48.00" x2="200.00" y2="22.00"/><path class="arrow" d="M170.00,48.00 L170.87,46.57 L171.54,47.34 Z"/><circle class="balloon" cx="200.00" cy="22.00" r="2.80"/><text class="baltxt" x="200.00" y="23.15" text-anchor="middle" font-size="3.1">5</text><text class="vlabel" x="120.00" y="12.00" text-anchor="middle" font-size="3.0">POWER WIRING  &#183;  charge and run from one cell</text><text class="vlabel" x="14.00" y="164.00" text-anchor="start" font-size="3.2">NOTES</text><circle class="balloon" cx="16.80" cy="169.50" r="2.80"/><text class="baltxt" x="16.80" y="170.65" text-anchor="middle" font-size="3.1">1</text><text class="note" x="23.00" y="170.50" text-anchor="start" font-size="2.7">USB-C breakout needs 5.1k from CC1 and CC2 to GND or a USB-C</text><text class="note" x="23.00" y="174.20" text-anchor="start" font-size="2.7">source will never turn its 5 V on. VBUS and GND only, no data</text><circle class="balloon" cx="16.80" cy="179.70" r="2.80"/><text class="baltxt" x="16.80" y="180.85" text-anchor="middle" font-size="3.1">2</text><text class="note" x="23.00" y="180.70" text-anchor="start" font-size="2.7">charge current: Adafruit's pinout page says it ships at 500</text><text class="note" x="23.00" y="184.40" text-anchor="start" font-size="2.7">mA, the product page says 1 A - CHECK THE BOARD. 1 A is 0.5C</text><text class="note" x="23.00" y="188.10" text-anchor="start" font-size="2.7">for this cell and is what you want. Solar capability is input</text><text class="note" x="23.00" y="191.80" text-anchor="start" font-size="2.7">voltage regulation and is inert on USB</text><circle class="balloon" cx="16.80" cy="197.30" r="2.80"/><text class="baltxt" x="16.80" y="198.45" text-anchor="middle" font-size="3.1">6</text><text class="note" x="23.00" y="198.30" text-anchor="start" font-size="2.7">THREE WIRES = the pack has an NTC. Cut the TH jumper before</text><text class="note" x="23.00" y="202.00" text-anchor="start" font-size="2.7">wiring yellow here (THERM on the 4755). Verify first: red</text><text class="note" x="23.00" y="205.70" text-anchor="start" font-size="2.7">positive to black at 3.0-4.2 V, and yellow-to-black ~10k</text><text class="note" x="23.00" y="209.40" text-anchor="start" font-size="2.7">falling as you warm it. If it does not move it is not a</text><text class="note" x="23.00" y="213.10" text-anchor="start" font-size="2.7">thermistor: leave the jumper intact. Check for a protection</text><text class="note" x="23.00" y="216.80" text-anchor="start" font-size="2.7">PCB at the tab end; without one there is no short or</text><text class="note" x="23.00" y="220.50" text-anchor="start" font-size="2.7">overdischarge protection</text><text class="vlabel" x="142.00" y="164.00" text-anchor="start" font-size="3.2"> </text><circle class="balloon" cx="144.80" cy="169.50" r="2.80"/><text class="baltxt" x="144.80" y="170.65" text-anchor="middle" font-size="3.1">3</text><text class="note" x="151.00" y="170.50" text-anchor="start" font-size="2.7">LOAD is 4.5 V max - from the input when plugged in, from</text><text class="note" x="151.00" y="174.20" text-anchor="start" font-size="2.7">the cell otherwise. The 5V pin takes 3.6-5.5 V and browns</text><text class="note" x="151.00" y="177.90" text-anchor="start" font-size="2.7">out near 3.6 V</text><circle class="balloon" cx="144.80" cy="183.40" r="2.80"/><text class="baltxt" x="144.80" y="184.55" text-anchor="middle" font-size="3.1">4</text><text class="note" x="151.00" y="184.40" text-anchor="start" font-size="2.7">divider must land on ADC1 (GPIO 32-39) - ADC2 is dead</text><text class="note" x="151.00" y="188.10" text-anchor="start" font-size="2.7">while WiFi is on. Below 3.6 V firmware MUST deep-sleep for</text><text class="note" x="151.00" y="191.80" text-anchor="start" font-size="2.7">good, or the cell gets dragged to its protection cut</text><circle class="balloon" cx="144.80" cy="197.30" r="2.80"/><text class="baltxt" x="144.80" y="198.45" text-anchor="middle" font-size="3.1">5</text><text class="note" x="151.00" y="198.30" text-anchor="start" font-size="2.7">PWR / CHRG / FAULT LEDs onboard; S1 and S2 pads mirror</text><text class="note" x="151.00" y="202.00" text-anchor="start" font-size="2.7">them. /CE pulled high disables charging</text><text class="note" x="166.00" y="206.60" text-anchor="start" font-size="2.35">STLs export flat-face-down and MIRRORED IN X (print_mirror = true)</text><rect class="tbframe" x="166.00" y="209.00" width="96.00" height="18.00" rx="0.00"/><line class="tbrule" x1="166.00" y1="218.00" x2="262.00" y2="218.00"/><line class="tbrule" x1="218.80" y1="218.00" x2="218.80" y2="227.00"/><line class="tbrule" x1="240.88" y1="218.00" x2="240.88" y2="227.00"/><text class="tbname" x="168.00" y="215.12" text-anchor="start" font-size="3.6">POWER WIRING</text><text class="tbmeta" x="168.00" y="224.30" text-anchor="start" font-size="2.4">UNITS mm &#183; SCALE N.T.S.</text><text class="tbmeta" x="221.20" y="224.30" text-anchor="start" font-size="2.4">SHEET 8/8</text><text class="tbmeta" x="242.80" y="224.30" text-anchor="start" font-size="2.4">REV E</text></svg>